<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>碎银几两 · 打卡助手</title>
    <style>
        :root {
            --bg: #f1f3f5;
            --card: #fff;
            --text: #1a1a1a;
            --sub: #999;
            --blue: #007dff;
            --teal: #00b386;
            --gold: #e6980a;
            --red: #e84040;
            --border: #e5e5e5;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "HarmonyOS Sans", -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 16px 32px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 440px; margin: 0 auto; position: relative; }
        .header { text-align: center; padding: 32px 4px 12px; position: relative; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .header .settings-icon {
            position: absolute; right: 4px; top: 32px; width: 36px; height: 36px;
            border-radius: 50%; background: var(--card); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; color: var(--sub);
        }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 16px; letter-spacing: 0.5px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .stat { text-align: center; padding: 4px 0; }
        .stat .val { font-size: 22px; font-weight: 700; color: var(--text); display: block; line-height: 1.3; }
        .stat .lbl { font-size: 11px; color: var(--sub); }
        .progress-row { display: flex; align-items: center; gap: 20px; }
        .ring { width: 80px; height: 80px; flex-shrink: 0; }
        .ring svg { transform: rotate(-90deg); }
        .ring .bg { fill: none; stroke: #e8e8e8; stroke-width: 15; }
        .ring .fg { fill: none; stroke: var(--blue); stroke-width: 15; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
        .ring-text { font-size: 18px; font-weight: 700; fill: var(--text); text-anchor: middle; dominant-baseline: central; transform: rotate(90deg); transform-origin: 40px 40px; }
        .ring-pct { font-size: 11px; fill: var(--sub); text-anchor: middle; dominant-baseline: central; transform: rotate(90deg); transform-origin: 40px 40px; }
        .prog-info { flex: 1; font-size: 14px; line-height: 2; color: var(--sub); }
        .prog-info strong { color: var(--text); font-weight: 600; }
        .prog-info .encourage { color: var(--teal); font-weight: 500; font-size: 13px; }
        .slogan-card { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .slogan-left { display: flex; align-items: center; gap: 10px; }
        .slogan-icon { width: 36px; height: 36px; border-radius: 50%; background: #e8f2ff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .slogan-text { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s; letter-spacing: 0.5px; }
        .btn:active { opacity: 0.7; }
        .btn-clock { display: block; width: 80%; margin: 0 auto; padding: 22px 0; border: none; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; letter-spacing: 4px; text-align: center; }
        .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
        .btn-danger { background: #ffe8e8; color: var(--red); border: 1px solid var(--red); }
        .btn-sm { font-size: 14px; padding: 12px; }
        .next-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .next-item:active { background: #f8f8f8; }
        .next-item .nd { font-weight: 500; font-size: 14px; }
        .next-item .nt { font-size: 11px; color: var(--blue); background: #e8f2ff; padding: 3px 8px; border-radius: 6px; margin-left: 8px; font-weight: 600; }
        .next-item .ns { color: var(--teal); font-weight: 500; font-size: 13px; text-align: right; line-height: 1.5; }
        .next-item .ns .blocked-shift { text-decoration: line-through; color: #ccc; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { padding: 10px 8px; text-align: left; font-size: 11px; color: var(--sub); font-weight: 500; border-bottom: 1px solid var(--border); }
        td { padding: 12px 8px; border-bottom: 1px solid #f5f5f5; font-size: 13px; vertical-align: top; }
        tbody tr:active { background: #f8f8f8; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .badge-wd { background: #e8f8f0; color: #00b386; }
        .badge-we { background: #fef5e8; color: #e6980a; }
        .badge-hd { background: #ffe8e8; color: #e84040; }
        .badge-dt { background: #e8f2ff; color: var(--blue); font-size: 10px; font-weight: 600; }
        .row-blocked { opacity: 0.45; }
        .expand-btn { text-align: center; padding: 12px 0 4px; font-size: 13px; color: var(--blue); cursor: pointer; font-weight: 500; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 998; align-items: flex-end; justify-content: center; }
        .modal.on { display: flex; }
        .modal-box { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 22px 36px; width: 100%; max-width: 440px; animation: slideUp 0.3s ease; overflow-y: auto; max-height: 90vh; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; text-align: center; }
        .modal-box p { font-size: 13px; color: var(--sub); margin-bottom: 20px; text-align: center; }
        .modal-box label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 6px; font-weight: 500; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; margin-bottom: 14px; background: #f8f9fa; }
        .modal-box .hint { font-size: 12px; color: var(--blue); margin-top: -8px; margin-bottom: 14px; }
        .empty { text-align: center; padding: 32px 0; color: var(--sub); font-size: 14px; }
        .handle { width: 36px; height: 4px; background: #d5d5d5; border-radius: 2px; margin: 0 auto 20px; }
        .action-sheet { display: flex; flex-direction: column; gap: 8px; }
        .action-sheet .as-btn { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; }
        .action-sheet .as-btn:active { background: #f5f5f5; }
        .action-sheet .as-btn.holiday { color: #e84040; border-color: #e84040; }
        .action-sheet .as-btn.vacation { color: #e6980a; border-color: #e6980a; }
        .action-sheet .as-btn.workday { color: #e6980a; border-color: #e6980a; }
        .action-sheet .as-section-title { font-size: 12px; color: var(--sub); font-weight: 600; margin-top: 12px; margin-bottom: 4px; letter-spacing: 0.5px; }
        .action-sheet .as-shift-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; font-size: 14px; }
        .action-sheet .as-shift-row:last-child { border-bottom: none; }
        .action-sheet .as-shift-row span { flex: 1; }
        .action-sheet .as-shift-row .as-toggle { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: #fff; transition: all 0.15s; }
        .action-sheet .as-shift-row .as-toggle.blocked { background: #ffe8e8; color: #e84040; border-color: #e84040; }
        .action-sheet .as-shift-row .as-toggle.active { background: #e8f8f0; color: #00b386; border-color: #00b386; }
        .result-modal .result-icon { text-align: center; font-size: 48px; margin-bottom: 8px; }
        .result-modal .result-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--teal); margin-bottom: 16px; }
        .result-modal .result-detail { font-size: 14px; line-height: 2; color: var(--text); margin-bottom: 16px; padding: 0 8px; }
        .result-modal .result-detail .day-group { margin-bottom: 8px; }
        .result-modal .result-detail .day-date { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        .result-modal .result-detail .day-shifts { font-size: 13px; color: #666; margin-bottom: 4px; }
        .result-modal .result-detail .day-summary { font-weight: 600; color: #00b386; }
        .result-modal .quote-divider { border: none; border-top: 2px solid #e0e0e0; margin: 20px 0; }
        .result-modal .quote-text { text-align: center; font-size: 16px; font-weight: 500; color: var(--sub); line-height: 1.6; padding: 0 12px; font-style: italic; }
        .round-correct-item { margin-bottom: 16px; }
        .round-correct-item label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
        .round-correct-item .current-value { font-size: 14px; color: var(--blue); margin-bottom: 8px; padding: 6px 10px; background: #f0f7ff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>碎银几两</h1><div class="settings-icon" onclick="openSettingsMenu()">⚙</div></div>
        <div class="card"><div class="card-title">数据总览</div><div class="stats"><div class="stat"><span class="val" id="days">0</span><span class="lbl">天数</span></div><div class="stat"><span class="val" id="hrs">0</span><span class="lbl">时长/h</span></div><div class="stat"><span class="val" id="amt">0</span><span class="lbl">金额</span></div><div class="stat"><span class="val" id="rnd">1</span><span class="lbl">轮次</span></div></div></div>
        <div class="card"><div class="card-title">轮次进度</div><div class="progress-row"><div class="ring"><svg width="80" height="80" viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="30" /><circle class="fg" id="ringFg" cx="40" cy="40" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" /><text class="ring-text" x="40" y="37" id="ringPct">0</text><text class="ring-pct" x="40" y="48">%</text></svg></div><div class="prog-info">第 <strong id="rNum">1</strong> 轮<br>已完成 <strong id="rDone">0h</strong><br>剩余 <strong id="rLeft">24h</strong><br><span class="encourage" id="encourage">千里之行，始于足下 🌱</span></div></div></div>
        <div class="slogan-card"><div class="slogan-left"><div class="slogan-icon">💪</div><div class="slogan-text">人世间的一切幸福都需要靠辛勤的劳动来创造。</div></div></div>
        <div class="card" style="padding-bottom:16px;"><button class="btn-clock" onclick="clockIn()">打个卡</button></div>
        <div class="card"><div class="card-title">下一岗</div><div id="next"></div></div>
        <div class="card"><div class="card-title">记录</div><div id="history"></div><div id="expandArea"></div></div>
    </div>

    <div class="modal" id="modal"><div class="modal-box"><div class="handle"></div><h3>首班岗设置</h3><p>设置你开始上班的第一岗，系统自动推算轮次</p><label>日期</label><input type="date" id="sDate"><label>岗时间</label><select id="sShift"></select><div class="hint" id="shiftHint">第1轮第1岗 · D1 开始</div><label>轮目标（小时）</label><input type="number" id="sTarget" value="24" min="1" max="100"><button class="btn btn-primary" onclick="saveSettings()">保存</button><button class="btn btn-outline btn-sm" onclick="closeSettings()">取消</button></div></div>
    <div class="modal" id="settingsMenuModal"><div class="modal-box"><div class="handle"></div><h3>设置</h3><p>管理首班岗与数据</p><button class="btn btn-outline" onclick="openSettingsFromMenu()">设置首班岗</button><button class="btn btn-outline" onclick="openRoundCorrector()">轮次修正</button><button class="btn btn-outline btn-sm" onclick="resetAll()" style="color:var(--red);border-color:var(--red);">清空所有打卡数据</button><button class="btn btn-outline btn-sm" onclick="closeSettingsMenu()" style="margin-top:8px;">取消</button></div></div>
    <div class="modal" id="roundCorrectorModal"><div class="modal-box"><div class="handle"></div><h3>轮次修正</h3><p>调整后自动重算所有历史记录的金额</p><div class="round-correct-item"><label>当前首班岗</label><div class="current-value" id="currentFirstInfo"></div></div><div class="round-correct-item"><label>修改首班岗日期</label><input type="date" id="correctFirstDate"></div><div class="round-correct-item"><label>修改首班岗时段</label><select id="correctFirstShift"></select></div><div class="round-correct-item"><label>或直接设置当前轮次</label><input type="number" id="correctRoundNum" placeholder="输入轮次数字" step="1" min="1"><div class="hint">设置后系统会从该轮次的第一天开始重新计算</div></div><button class="btn btn-primary" onclick="applyRoundCorrection()">应用修正并重算</button><button class="btn btn-outline btn-sm" onclick="closeRoundCorrector()">取消</button></div></div>
    <div class="modal" id="actionModal"><div class="modal-box"><div class="handle"></div><h3 id="actionTitle">日期操作</h3><p id="actionDate"></p><div class="action-sheet" id="actionContent"></div><button class="btn btn-outline btn-sm" onclick="closeActionModal()" style="margin-top:12px;">取消</button></div></div>
    <div class="modal result-modal" id="resultModal"><div class="modal-box"><div class="handle"></div><div class="result-icon">✅</div><div class="result-title" id="resultTitle">打卡成功！</div><div class="result-detail" id="resultDetail"></div><hr class="quote-divider"><div class="quote-text" id="quoteText">劳动最光荣</div><div class="quote-author" id="quoteAuthor"></div><button class="btn btn-primary" onclick="closeResultModal()" style="margin-top:16px;">好的</button></div></div>

    <script>
        // ==================== 常量 ====================
        var DTYPES = ["D1", "D2", "D3", "D4", "D5"];
        var HOLIDAY_RATE = 18.75;
        var WEEKEND_RATE = 12.5;
        var WEEKDAY_RATE = 10;
        
        // 固定排班数据（D1~D5）
        var DAILY = {
            D1: ["20:00-23:00"],
            D2: ["07:20-11:30", "23:00-24:00"],
            D3: ["00:00-02:00", "11:30-14:30", "17:30-20:00"],
            D4: ["02:00-05:00", "14:30-17:30"],
            D5: ["05:00-07:20"]
        };
        
        // 时段小时数
        var SHIFT_HOURS = {
            "07:20-11:30": 4.2, "11:30-14:30": 3, "14:30-17:30": 3,
            "17:30-20:00": 2.5, "20:00-23:00": 3, "23:00-24:00": 1,
            "00:00-02:00": 2, "02:00-05:00": 3, "05:00-07:20": 2.3
        };
        
        // 法定节假日第一天
        var HOLIDAY_FIRST_DAY = {
            "2026-01-01": true, "2026-02-17": true, "2026-04-05": true,
            "2026-05-01": true, "2026-06-19": true, "2026-09-25": true, "2026-10-01": true
        };
        
        // 调休上班日
        var WORKDAY_WEEKENDS = {
            "2026-02-28": true, "2026-04-11": true, "2026-05-09": true,
            "2026-09-20": true, "2026-10-10": true, "2026-10-11": true
        };
        
        // ==================== 全局变量 ====================
        var S = { 
            target: 24, firstDate: "", firstShift: "", 
            recs: [], news: [], setup: false,
            manualHolidays: {}, blockedShifts: {}, vacationDays: {}, manualWorkdayWeekends: {} 
        };
        var EXPANDED = false;
        
        // ==================== 工具函数 ====================
        function now() { return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Shanghai" })); }
        function fd(d) { var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0'); return y + "-" + m + "-" + day; }
        function wk(ds) { return ['日','一','二','三','四','五','六'][new Date(ds + "T12:00:00+08:00").getDay()]; }
        function we(ds) { var w = wk(ds); return w === '六' || w === '日'; }
        function toMinutes(t) { var p = t.split(':'); return parseInt(p[0]) * 60 + parseInt(p[1]); }
        function ffTime(d) { var h = String(d.getHours()).padStart(2,'0'), m = String(d.getMinutes()).padStart(2,'0'); return h + ":" + m; }
        
        function getShiftHours(shift) { return SHIFT_HOURS[shift] || 0; }
        
        function shiftToDType(ss) { for (var d in DAILY) if (DAILY[d].indexOf(ss) >= 0) return d; return "D1"; }
        
        function getDayTypeForDate(ds) {
            if (!S.firstDate || !S.firstShift) return "D1";
            var base = new Date(S.firstDate + "T12:00:00+08:00");
            var tgt = new Date(ds + "T12:00:00+08:00");
            var diff = Math.round((tgt - base) / 86400000);
            var firstDtype = shiftToDType(S.firstShift);
            var baseIdx = DTYPES.indexOf(firstDtype);
            var idx = ((baseIdx + diff) % 5 + 5) % 5;
            return DTYPES[idx];
        }
        
        function getTodayShifts(ds) { return DAILY[getDayTypeForDate(ds)] || []; }
        
        function isHoliday(ds) {
            if (S.manualHolidays[ds]) return true;
            if (S.vacationDays[ds]) return false;
            return !!HOLIDAY_FIRST_DAY[ds];
        }
        
        function isVacation(ds) { return !!S.vacationDays[ds]; }
        
        function isWorkdayWeekend(ds) {
            if (S.manualWorkdayWeekends[ds]) return true;
            if (S.vacationDays[ds]) return false;
            if (S.manualHolidays[ds]) return false;
            return !!WORKDAY_WEEKENDS[ds];
        }
        
        function getRate(ds) {
            if (isVacation(ds)) return 0;
            if (isHoliday(ds)) return HOLIDAY_RATE;
            if (isWorkdayWeekend(ds)) return WEEKDAY_RATE;
            return we(ds) ? WEEKEND_RATE : WEEKDAY_RATE;
        }
        
        function getRateLabel(ds) {
            if (isVacation(ds)) return '休假 0元/h';
            if (isHoliday(ds)) return '节假日 ' + getRate(ds) + '元/h';
            if (isWorkdayWeekend(ds)) return '调休上班 ' + getRate(ds) + '元/h';
            return we(ds) ? '周末 ' + getRate(ds) + '元/h' : '普通 ' + getRate(ds) + '元/h';
        }
        
        function allRecords() { return S.recs.concat(S.news); }
        
        function getAvailableShiftsForDate(ds) {
            var allShifts = getTodayShifts(ds);
            var blocked = S.blockedShifts[ds] || {};
            var rec = null;
            for (var i = 0; i < S.recs.length; i++) if (S.recs[i].d === ds) { rec = S.recs[i]; break; }
            if (!rec) for (var i = 0; i < S.news.length; i++) if (S.news[i].d === ds) { rec = S.news[i]; break; }
            var doneShifts = rec ? rec.s : [];
            var available = [];
            for (var i = 0; i < allShifts.length; i++) {
                var ss = allShifts[i];
                if (blocked[ss]) continue;
                if (doneShifts.indexOf(ss) >= 0) continue;
                available.push({ date: ds, shift: ss, hours: getShiftHours(ss) });
            }
            return available;
        }
        
        function validateRecordsForDate(ds) {
            var changed = false;
            for (var i = 0; i < S.recs.length; i++) {
                if (S.recs[i].d === ds) {
                    var r = S.recs[i];
                    var newRate = getRate(ds);
                    if (r.r !== newRate) {
                        r.r = newRate;
                        r.a = r.h * newRate;
                        changed = true;
                    }
                    break;
                }
            }
            for (var i = 0; i < S.news.length; i++) {
                if (S.news[i].d === ds) {
                    var r = S.news[i];
                    var newRate = getRate(ds);
                    if (r.r !== newRate) {
                        r.r = newRate;
                        r.a = r.h * newRate;
                        changed = true;
                    }
                    break;
                }
            }
            if (changed) { save(); update(); }
            return changed;
        }
        
        // ==================== 打卡核心 ====================
        function clockIn() {
            if (!S.setup) { openSettings(); return; }
            
            var nowTime = now();
            var td = fd(nowTime);
            var currentMin = toMinutes(ffTime(nowTime));
            var allMissing = [];
            
            var startDate = new Date(S.firstDate + "T12:00:00+08:00");
            var endDate = new Date(td + "T12:00:00+08:00");
            
            for (var d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                var ds = fd(d);
                if (isVacation(ds)) continue;
                var available = getAvailableShiftsForDate(ds);
                
                for (var i = 0; i < available.length; i++) {
                    var shift = available[i];
                    var parts = shift.shift.split('-');
                    var startMin = toMinutes(parts[0]);
                    var endMin = toMinutes(parts[1]);
                    
                    if (ds < td) {
                        allMissing.push(shift);
                    } else if (ds === td) {
                        if (currentMin >= endMin) {
                            allMissing.push(shift);
                        } else if (currentMin >= startMin && currentMin < endMin) {
                            allMissing.push(shift);
                        } else if (startMin > currentMin && (startMin - currentMin) <= 60) {
                            allMissing.push(shift);
                        }
                    }
                }
            }
            
            if (allMissing.length === 0) {
                toast('暂无待打卡岗');
                return;
            }
            
            // 找出最后一天的日期
            var maxDate = '';
            for (var i = 0; i < allMissing.length; i++) {
                if (allMissing[i].date > maxDate) maxDate = allMissing[i].date;
            }
            
            // 只取最后一天的岗
            var lastDayShifts = [];
            for (var i = 0; i < allMissing.length; i++) {
                if (allMissing[i].date === maxDate) lastDayShifts.push(allMissing[i]);
            }
            
            doIt(allMissing);
            showResultModal(lastDayShifts);
        }
        
        function doIt(shifts) {
            var n = now(), groups = {};
            for (var i = 0; i < shifts.length; i++) {
                var s = shifts[i];
                if (!groups[s.date]) groups[s.date] = [];
                var found = false;
                for (var j = 0; j < groups[s.date].length; j++) {
                    if (groups[s.date][j].shift === s.shift) { found = true; break; }
                }
                if (!found) groups[s.date].push(s);
            }
            
            var dates = Object.keys(groups);
            for (var di = 0; di < dates.length; di++) {
                var ds = dates[di], lst = groups[ds];
                var existing = null;
                for (var i = 0; i < S.news.length; i++) if (S.news[i].d === ds) { existing = S.news[i]; break; }
                if (!existing) for (var i = 0; i < S.recs.length; i++) if (S.recs[i].d === ds) { existing = S.recs[i]; break; }
                
                if (existing) {
                    for (var li = 0; li < lst.length; li++) {
                        if (existing.s.indexOf(lst[li].shift) < 0) existing.s.push(lst[li].shift);
                    }
                    existing.s.sort();
                    existing.h = 0;
                    for (var si = 0; si < existing.s.length; si++) existing.h += getShiftHours(existing.s[si]);
                    existing.r = getRate(ds);
                    existing.a = existing.h * existing.r;
                    existing.w = wk(ds);
                    existing.t = getDayTypeForDate(ds);
                } else {
                    var totalH = 0, shiftNames = [];
                    for (var li = 0; li < lst.length; li++) {
                        totalH += lst[li].hours;
                        shiftNames.push(lst[li].shift);
                    }
                    shiftNames.sort();
                    S.news.push({
                        d: ds, w: wk(ds), s: shiftNames, h: totalH,
                        r: getRate(ds), a: totalH * getRate(ds),
                        t: getDayTypeForDate(ds), ts: n.getTime()
                    });
                }
            }
            save(); update();
        }
        
        function showResultModal(shifts) {
            if (!shifts || shifts.length === 0) { toast('无打卡记录'); return; }
            
            var ds = shifts[0].date;
            var totalH = 0;
            for (var i = 0; i < shifts.length; i++) totalH += shifts[i].hours;
            var rate = getRate(ds);
            var amount = totalH * rate;
            
            var shiftNames = [];
            for (var i = 0; i < shifts.length; i++) {
                shiftNames.push(shifts[i].shift + ' (' + shifts[i].hours.toFixed(1) + 'h)');
            }
            
            var html = '<div class="day-group">';
            html += '<div class="day-date">📅 ' + ds + ' 星期' + wk(ds) + '</div>';
            html += '<div class="day-shifts">时段：' + shiftNames.join('、') + '</div>';
            html += '<div class="day-summary">' + getRateLabel(ds) + ' | 合计' + totalH.toFixed(1) + 'h · ' + amount.toFixed(2) + '元</div>';
            html += '</div>';
            
            document.getElementById('resultDetail').innerHTML = html;
            document.getElementById('quoteText').innerHTML = '💪 劳动最光荣 💪';
            document.getElementById('resultModal').classList.add('on');
        }
        
        // ==================== 轮次计算 ====================
        function getRoundInfo() {
            if (!S.firstDate || !S.firstShift) return { round: 1, startDate: "" };
            var base = new Date(S.firstDate + "T12:00:00+08:00");
            var tgt = now();
            var diff = Math.round((tgt - base) / 86400000);
            if (diff < 0) return { round: 1, startDate: S.firstDate };
            var firstDtype = shiftToDType(S.firstShift);
            var baseIdx = DTYPES.indexOf(firstDtype);
            var completedCycles = Math.floor((baseIdx + diff) / 5);
            var round = completedCycles + 1;
            var cycleStart = new Date(base);
            cycleStart.setDate(cycleStart.getDate() + completedCycles * 5 - baseIdx);
            return { round: round, startDate: fd(cycleStart) };
        }
        
        function getRoundWorkedHours(roundNum) {
            if (!S.firstDate) return 0;
            var info = getRoundInfo();
            var all = allRecords();
            var sorted = [];
            for (var i = 0; i < all.length; i++) sorted.push(all[i]);
            sorted.sort(function(a, b) { return a.d.localeCompare(b.d); });
            
            var nextRoundStart = new Date(S.firstDate + "T12:00:00+08:00");
            var firstDtype = shiftToDType(S.firstShift);
            var baseIdx = DTYPES.indexOf(firstDtype);
            nextRoundStart.setDate(nextRoundStart.getDate() + roundNum * 5 - baseIdx);
            var nextStr = fd(nextRoundStart);
            var total = 0;
            for (var i = 0; i < sorted.length; i++) {
                if (sorted[i].d >= info.startDate && sorted[i].d < nextStr) total += sorted[i].h;
            }
            return total;
        }
        
        function currentRound() { return getRoundInfo().round; }
        
        function getEncourage(pct) {
            if (pct <= 0) return "千里之行，始于足下 🌱";
            if (pct <= 30) return "积少成多，聚沙成塔 📝";
            if (pct <= 60) return "持之以恒，水滴石穿 ✊";
            if (pct <= 80) return "行百里者半九十，加油 🔥";
            if (pct < 100) return "胜利在望，一鼓作气 ⚡";
            return "目标达成，了不起！🎉";
        }
        
        // ==================== 更新UI ====================
        function update() {
            var all = allRecords();
            var days = all.length;
            var totalH = 0, totalM = 0;
            for (var i = 0; i < all.length; i++) {
                totalH += all[i].h;
                totalM += all[i].a;
            }
            var round = currentRound();
            var worked = getRoundWorkedHours(round);
            var left = Math.max(0, S.target - worked);
            var pct = Math.min((worked / S.target) * 100, 100);
            
            document.getElementById('days').textContent = days;
            document.getElementById('hrs').textContent = totalH.toFixed(1);
            document.getElementById('amt').textContent = totalM.toFixed(2);
            document.getElementById('rnd').textContent = round;
            document.getElementById('rNum').textContent = round;
            document.getElementById('rDone').textContent = worked.toFixed(1) + 'h';
            document.getElementById('rLeft').textContent = left.toFixed(1) + 'h';
            document.getElementById('ringPct').textContent = Math.round(pct);
            document.getElementById('encourage').textContent = getEncourage(Math.round(pct));
            
            var circ = 2 * Math.PI * 30;
            document.getElementById('ringFg').style.strokeDasharray = circ;
            document.getElementById('ringFg').style.strokeDashoffset = circ * (1 - pct / 100);
            
            // 下一岗
            var td = fd(now());
            var upcomingList = [];
            for (var i = 0; i < 3; i++) {
                var d = new Date(now());
                d.setDate(d.getDate() + i);
                var ds = fd(d);
                var available = getAvailableShiftsForDate(ds);
                for (var j = 0; j < available.length; j++) {
                    upcomingList.push({ date: ds, wd: wk(ds), shift: available[j].shift });
                }
                if (upcomingList.length >= 2) break;
            }
            
            var nextHtml = '';
            for (var i = 0; i < Math.min(2, upcomingList.length); i++) {
                var item = upcomingList[i];
                var isHol = isHoliday(item.date);
                var isVac = isVacation(item.date);
                var isWW = isWorkdayWeekend(item.date);
                var holidayLabel = '';
                if (isHol) holidayLabel = ' <span class="nt" style="background:#ffe8e8;color:#e84040;">节假日</span>';
                else if (isVac) holidayLabel = ' <span class="nt" style="background:#f5f5f5;color:#999;">休假</span>';
                else if (isWW) holidayLabel = ' <span class="nt" style="background:#fef5e8;color:#e6980a;">调休上班</span>';
                nextHtml += '<div class="next-item"><div class="nd">' + item.date.slice(5) + '（' + item.wd + '）<span class="nt">' + getDayTypeForDate(item.date) + '</span>' + holidayLabel + '</div><div class="ns">' + item.shift + '</div></div>';
            }
            document.getElementById('next').innerHTML = nextHtml || '<div class="empty">暂无待打卡岗</div>';
            
            // 历史记录 - 修复表格
            var sorted = [];
            for (var i = 0; i < all.length; i++) sorted.push(all[i]);
            sorted.sort(function(a, b) { return b.d.localeCompare(a.d); });
            var showCount = EXPANDED ? sorted.length : Math.min(5, sorted.length);
            
            var tb = '<table><thead><tr><th>日期</th><th>星期</th><th>类型</th><th>时段</th><th>时长</th><th>金额</th></tr></thead><tbody>';
            for (var i = 0; i < showCount; i++) {
                var r = sorted[i];
                var badge = 'badge-wd';
                var rowClass = '';
                if (isVacation(r.d)) { badge = 'badge-hd'; rowClass = 'row-blocked'; }
                else if (isHoliday(r.d)) badge = 'badge-hd';
                else if (r.r === WEEKEND_RATE) badge = 'badge-we';
                var holLabel = '';
                if (isVacation(r.d)) holLabel = ' (休假)';
                else if (isHoliday(r.d)) holLabel = ' (节假日)';
                else if (isWorkdayWeekend(r.d)) holLabel = ' (调休上班)';
                
                tb += '<tr class="' + rowClass + '" data-date="' + r.d + '" ontouchstart="longPressStart(event,\'' + r.d + '\')" ontouchend="longPressEnd(event)" ontouchmove="longPressMove(event)">';
                tb += '<td>' + r.d.slice(5) + holLabel + '</td>';
                tb += '<td>' + r.w + '</td>';
                tb += '<td><span class="badge-dt">' + r.t + '</span></td>';
                tb += '<td style="font-size:12px;line-height:1.5;">' + r.s.join('<br>') + '</td>';
                tb += '<td>' + r.h.toFixed(1) + 'h</td>';
                tb += '<td><span class="badge ' + badge + '">' + r.a.toFixed(2) + '</span></td>';
                tb += '</tr>';
            }
            tb += '</tbody></table>';
            document.getElementById('history').innerHTML = tb;
            
            var expandArea = document.getElementById('expandArea');
            if (sorted.length > 5) {
                expandArea.innerHTML = EXPANDED ? '<div class="expand-btn" onclick="toggleExpand()">收起 ▲</div>' : '<div class="expand-btn" onclick="toggleExpand()">展开更多（共' + sorted.length + '条） ▼</div>';
            } else {
                expandArea.innerHTML = '';
            }
        }

        // ==================== 长按操作 ====================

        function removeHoliday(ds) { if (S.manualHolidays[ds]) delete S.manualHolidays[ds]; validateRecordsForDate(ds); closeActionModal(); toast(ds + ' 已取消节假日标记'); }
        function setVacation(ds) { S.vacationDays[ds] = true; if (S.manualHolidays[ds]) delete S.manualHolidays[ds]; validateRecordsForDate(ds); closeActionModal(); toast(ds + ' 已设为休假'); }
        function removeVacation(ds) { if (S.vacationDays[ds]) delete S.vacationDays[ds]; validateRecordsForDate(ds); closeActionModal(); toast(ds + ' 已取消休假'); }
        function setWorkdayWeekend(ds) { S.manualWorkdayWeekends[ds] = true; validateRecordsForDate(ds); closeActionModal(); toast(ds + ' 已标记为调休上班'); }
        function removeWorkdayWeekend(ds) { if (S.manualWorkdayWeekends[ds]) delete S.manualWorkdayWeekends[ds]; validateRecordsForDate(ds); closeActionModal(); toast(ds + ' 已恢复为周末计费'); }
        
        function toggleShift(ds, ss, block) {
            if (!S.blockedShifts[ds]) S.blockedShifts[ds] = {};
            if (block) {
                S.blockedShifts[ds][ss] = true;
            } else {
                delete S.blockedShifts[ds][ss];
                if (Object.keys(S.blockedShifts[ds]).length === 0) delete S.blockedShifts[ds];
            }
            save(); update(); openActionModal(ds);
        }
        
        // ==================== 数据持久化 ====================
        function save() {
            try {
                var data = {
                    target: S.target, firstDate: S.firstDate, firstShift: S.firstShift,
                    recs: S.recs, news: S.news, setup: S.setup,
                    manualHolidays: S.manualHolidays, blockedShifts: S.blockedShifts,
                    vacationDays: S.vacationDays, manualWorkdayWeekends: S.manualWorkdayWeekends
                };
                localStorage.setItem('clockin_final', JSON.stringify(data));
            } catch(e) {}
        }
        
        function load() {
            try {
                var raw = localStorage.getItem('clockin_final');
                if (raw) {
                    var d = JSON.parse(raw);
                    S.target = d.target || 24;
                    S.firstDate = d.firstDate || "";
                    S.firstShift = d.firstShift || "";
                    S.recs = d.recs || [];
                    S.news = d.news || [];
                    S.setup = d.setup !== undefined ? d.setup : false;
                    S.manualHolidays = d.manualHolidays || {};
                    S.blockedShifts = d.blockedShifts || {};
                    S.vacationDays = d.vacationDays || {};
                    S.manualWorkdayWeekends = d.manualWorkdayWeekends || {};
                } else {
                    S.setup = false;
                    S.recs = [];
                    S.news = [];
                    S.manualHolidays = {};
                    S.blockedShifts = {};
                    S.vacationDays = {};
                    S.manualWorkdayWeekends = {};
                }
            } catch(e) {
                S.setup = false;
                S.recs = [];
                S.news = [];
                S.manualHolidays = {};
                S.blockedShifts = {};
                S.vacationDays = {};
                S.manualWorkdayWeekends = {};
            }
        }
        
        function validate() {
            var all = allRecords();
            var changed = false;
            for (var i = 0; i < all.length; i++) {
                var r = all[i];
                var newW = wk(r.d);
                var newRate = getRate(r.d);
                var newDtype = getDayTypeForDate(r.d);
                if (r.w !== newW) { r.w = newW; changed = true; }
                if (r.r !== newRate) { r.r = newRate; r.a = r.h * newRate; changed = true; }
                if (r.t !== newDtype) { r.t = newDtype; changed = true; }
            }
            if (changed) save();
        }

        function applyRoundCorrection() {
            var newFirstDate = document.getElementById('correctFirstDate').value;
            var newFirstShift = document.getElementById('correctFirstShift').value;
            var newRoundNum = document.getElementById('correctRoundNum').value;
            
            if (newRoundNum && !isNaN(parseInt(newRoundNum))) {
                var targetRound = parseInt(newRoundNum);
                var currentR = currentRound();
                if (targetRound !== currentR) {

        function toast(m) {
            var o = document.querySelector('.toast');
            if (o) o.remove();
            var t = document.createElement('div');
            t.className = 'toast';
            t.textContent = m;
            document.body.appendChild(t);
            setTimeout(function() { if (t.parentNode) t.remove(); }, 2200);
        }
        
        function closeResultModal() { document.getElementById('resultModal').classList.remove('on'); }
        
        // ==================== 初始化 ====================
        document.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeSettings();
            if (e.target === document.getElementById('actionModal')) closeActionModal();
            if (e.target === document.getElementById('settingsMenuModal')) closeSettingsMenu();
            if (e.target === document.getElementById('resultModal')) closeResultModal();
            if (e.target === document.getElementById('roundCorrectorModal')) closeRoundCorrector();
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettings();
                closeActionModal();
                closeSettingsMenu();
                closeResultModal();
                closeRoundCorrector();
            }
        });
        
        window.onload = function() {
            load();
            if (!S.setup) {
                document.getElementById('days').textContent = '-';
                document.getElementById('hrs').textContent = '-';
                document.getElementById('amt').textContent = '-';
                document.getElementById('rnd').textContent = '-';
                document.getElementById('next').innerHTML = '<div class="empty">请先设置首班岗</div>';
            } else {
                validate();
                update();
            }
            rebuildFirstShiftSelect();
            var shiftSelect = document.getElementById('sShift');
            if (shiftSelect) shiftSelect.addEventListener('change', updateShiftHint);
        };
    </script>
</body>
</html>
