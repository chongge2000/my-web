<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>碎银几两 · 打卡助手</title>
    <style>
        :root {
            --bg: #f1f3f5;
            --card: #fff;
            --text: #1a1a1a;
            --sub: #999;
            --blue: #007dff;
            --teal: #00b386;
            --gold: #e6980a;
            --red: #e84040;
            --border: #e5e5e5;
            --radius: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "HarmonyOS Sans", -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 16px 32px;
            -webkit-tap-highlight-color: transparent;
        }
        .container { max-width: 440px; margin: 0 auto; position: relative; }
        .header { text-align: center; padding: 32px 4px 12px; position: relative; }
        .header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .header .settings-icon {
            position: absolute; right: 4px; top: 32px; width: 36px; height: 36px;
            border-radius: 50%; background: var(--card); border: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer; color: var(--sub);
        }
        .card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
        .card-title { font-size: 13px; font-weight: 600; color: var(--sub); margin-bottom: 16px; letter-spacing: 0.5px; }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .stat { text-align: center; padding: 4px 0; }
        .stat .val { font-size: 22px; font-weight: 700; color: var(--text); display: block; line-height: 1.3; }
        .stat .lbl { font-size: 11px; color: var(--sub); }
        .progress-row { display: flex; align-items: center; gap: 20px; }
        .ring { width: 80px; height: 80px; flex-shrink: 0; }
        .ring svg { transform: rotate(-90deg); }
        .ring .bg { fill: none; stroke: #e8e8e8; stroke-width: 15; }
        .ring .fg { fill: none; stroke: var(--blue); stroke-width: 15; stroke-linecap: round; }
        .ring-text { font-size: 18px; font-weight: 700; fill: var(--text); text-anchor: middle; dominant-baseline: central; transform: rotate(90deg); transform-origin: 40px 40px; }
        .ring-pct { font-size: 11px; fill: var(--sub); text-anchor: middle; dominant-baseline: central; transform: rotate(90deg); transform-origin: 40px 40px; }
        .prog-info { flex: 1; font-size: 14px; line-height: 2; color: var(--sub); }
        .prog-info strong { color: var(--text); font-weight: 600; }
        .prog-info .encourage { color: var(--teal); font-weight: 500; font-size: 13px; }
        .slogan-card { background: var(--card); border-radius: var(--radius); padding: 16px 20px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        .slogan-left { display: flex; align-items: center; gap: 10px; }
        .slogan-icon { width: 36px; height: 36px; border-radius: 50%; background: #e8f2ff; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .slogan-text { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.4; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s; letter-spacing: 0.5px; }
        .btn:active { opacity: 0.7; }
        .btn-clock { display: block; width: 80%; margin: 0 auto; padding: 22px 0; border: none; border-radius: 14px; font-size: 20px; font-weight: 700; cursor: pointer; background: var(--blue); color: #fff; letter-spacing: 4px; text-align: center; }
        .btn-outline { background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
        .btn-danger { background: #ffe8e8; color: var(--red); border: 1px solid var(--red); }
        .btn-sm { font-size: 14px; padding: 12px; }
        .next-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f5f5f5; cursor: pointer; }
        .next-item:active { background: #f8f8f8; }
        .next-item .nd { font-weight: 500; font-size: 14px; }
        .next-item .nt { font-size: 11px; color: var(--blue); background: #e8f2ff; padding: 3px 8px; border-radius: 6px; margin-left: 8px; font-weight: 600; }
        .next-item .ns { color: var(--teal); font-weight: 500; font-size: 13px; text-align: right; line-height: 1.5; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { padding: 10px 8px; text-align: left; font-size: 11px; color: var(--sub); font-weight: 500; border-bottom: 1px solid var(--border); }
        td { padding: 12px 8px; border-bottom: 1px solid #f5f5f5; font-size: 13px; vertical-align: top; }
        tbody tr:active { background: #f8f8f8; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 500; }
        .badge-wd { background: #e8f8f0; color: #00b386; }
        .badge-we { background: #fef5e8; color: #e6980a; }
        .badge-hd { background: #ffe8e8; color: #e84040; }
        .badge-dt { background: #e8f2ff; color: var(--blue); font-size: 10px; font-weight: 600; }
        .row-blocked { opacity: 0.45; }
        .expand-btn { text-align: center; padding: 12px 0 4px; font-size: 13px; color: var(--blue); cursor: pointer; font-weight: 500; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1a1a1a; color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,0.15); animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 998; align-items: flex-end; justify-content: center; }
        .modal.on { display: flex; }
        .modal-box { background: #fff; border-radius: 20px 20px 0 0; padding: 28px 22px 36px; width: 100%; max-width: 440px; animation: slideUp 0.3s ease; overflow-y: auto; max-height: 90vh; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-box h3 { font-size: 18px; font-weight: 700; margin-bottom: 6px; text-align: center; }
        .modal-box p { font-size: 13px; color: var(--sub); margin-bottom: 20px; text-align: center; }
        .modal-box label { font-size: 12px; color: var(--sub); display: block; margin-bottom: 6px; font-weight: 500; }
        .modal-box input, .modal-box select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 15px; margin-bottom: 14px; background: #f8f9fa; }
        .modal-box .hint { font-size: 12px; color: var(--blue); margin-top: -8px; margin-bottom: 14px; }
        .empty { text-align: center; padding: 32px 0; color: var(--sub); font-size: 14px; }
        .handle { width: 36px; height: 4px; background: #d5d5d5; border-radius: 2px; margin: 0 auto 20px; }
        .action-sheet { display: flex; flex-direction: column; gap: 8px; }
        .action-sheet .as-btn { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: #fff; font-size: 15px; font-weight: 500; cursor: pointer; text-align: center; }
        .action-sheet .as-section-title { font-size: 12px; color: var(--sub); font-weight: 600; margin-top: 12px; margin-bottom: 4px; }
        .schedule-editor { max-height: 70vh; overflow-y: auto; }
        .dtype-section { margin-bottom: 24px; border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
        .dtype-header { font-size: 16px; font-weight: 700; background: #f8f9fa; margin: -12px -12px 12px -12px; padding: 12px; border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--border); }
        .shift-item { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .shift-item input { flex: 1; min-width: 70px; margin-bottom: 0; }
        .shift-item .shift-hours { width: 70px; text-align: center; }
        .shift-item button { background: #ffe8e8; border: none; border-radius: 8px; padding: 8px 12px; color: var(--red); font-size: 12px; cursor: pointer; }
        .add-shift-btn { margin-top: 8px; background: #e8f2ff; border: none; border-radius: 8px; padding: 8px; width: 100%; color: var(--blue); font-weight: 500; cursor: pointer; }
        .plan-item { border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 12px; background: #f8f9fa; }
        .plan-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .plan-name { font-weight: 700; font-size: 16px; }
        .plan-badge { font-size: 11px; padding: 4px 8px; border-radius: 8px; background: var(--teal); color: white; }
        .plan-badge.active { background: var(--blue); }
        .plan-info { font-size: 12px; color: var(--sub); margin-bottom: 12px; }
        .plan-actions { display: flex; gap: 8px; }
        .result-modal .result-icon { text-align: center; font-size: 48px; margin-bottom: 8px; }
        .result-modal .result-title { text-align: center; font-size: 20px; font-weight: 700; color: var(--teal); margin-bottom: 16px; }
        .result-modal .result-detail { font-size: 14px; line-height: 2; color: var(--text); margin-bottom: 16px; padding: 0 8px; }
        .result-modal .result-detail .day-group { margin-bottom: 8px; }
        .result-modal .quote-divider { border: none; border-top: 2px solid #e0e0e0; margin: 20px 0; }
        .result-modal .quote-text { text-align: center; font-size: 18px; font-weight: 700; color: #1a1a1a; line-height: 1.8; padding: 0 12px; }
        .result-modal .quote-author { text-align: right; font-size: 14px; font-weight: 600; color: #e84040; margin-top: 8px; padding-right: 12px; }
        .round-correct-item { margin-bottom: 16px; }
        .round-correct-item label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
        .round-correct-item .current-value { font-size: 14px; color: var(--blue); margin-bottom: 8px; padding: 6px 10px; background: #f0f7ff; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>碎银几两</h1><div class="settings-icon" onclick="openSettingsMenu()">⚙</div></div>
        <div class="card"><div class="card-title">数据总览</div><div class="stats"><div class="stat"><span class="val" id="days">0</span><span class="lbl">天数</span></div><div class="stat"><span class="val" id="hrs">0</span><span class="lbl">时长/h</span></div><div class="stat"><span class="val" id="amt">0</span><span class="lbl">金额</span></div><div class="stat"><span class="val" id="rnd">1</span><span class="lbl">轮次</span></div></div></div>
        <div class="card"><div class="card-title">轮次进度</div><div class="progress-row"><div class="ring"><svg width="80" height="80" viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="30" /><circle class="fg" id="ringFg" cx="40" cy="40" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" /><text class="ring-text" x="40" y="37" id="ringPct">0</text><text class="ring-pct" x="40" y="48">%</text></svg></div><div class="prog-info">第 <strong id="rNum">1</strong> 轮<br>已完成 <strong id="rDone">0h</strong><br>剩余 <strong id="rLeft">24h</strong><br><span class="encourage" id="encourage">千里之行，始于足下 🌱</span></div></div></div>
        <div class="slogan-card"><div class="slogan-left"><div class="slogan-icon">💪</div><div class="slogan-text">人世间的一切幸福都需要靠辛勤的劳动来创造。</div></div></div>
        <div class="card" style="padding-bottom:16px;"><button class="btn-clock" onclick="clockIn()">打个卡</button></div>
        <div class="card"><div class="card-title">下一岗</div><div id="next"></div></div>
        <div class="card"><div class="card-title">记录</div><div id="history"></div><div id="expandArea"></div></div>
    </div>

    <div class="modal" id="modal"><div class="modal-box"><div class="handle"></div><h3>首班岗设置</h3><p>设置你开始上班的第一岗，系统自动推算轮次</p><label>日期</label><input type="date" id="sDate"><label>岗时间</label><select id="sShift"></select><div class="hint" id="shiftHint">第1轮第1岗 · D1 开始</div><label>轮目标（小时）</label><input type="number" id="sTarget" value="24" min="1" max="100"><button class="btn btn-primary" onclick="saveSettings()">保存</button><button class="btn btn-outline btn-sm" onclick="closeSettings()">取消</button></div></div>
    <div class="modal" id="settingsMenuModal"><div class="modal-box"><div class="handle"></div><h3>设置</h3><p>管理首班岗与数据</p><button class="btn btn-outline" onclick="openSettingsFromMenu()">设置首班岗</button><button class="btn btn-outline" onclick="openRoundCorrector()">轮次修正</button><button class="btn btn-outline" onclick="openPlanManager()">排班方案管理</button><button class="btn btn-outline btn-sm" onclick="resetAll()" style="color:var(--red);border-color:var(--red);">清空所有打卡数据</button><button class="btn btn-outline btn-sm" onclick="closeSettingsMenu()" style="margin-top:8px;">取消</button></div></div>
    <div class="modal" id="roundCorrectorModal"><div class="modal-box"><div class="handle"></div><h3>轮次修正</h3><p>调整后自动重算所有历史记录的金额</p><div class="round-correct-item"><label>当前首班岗</label><div class="current-value" id="currentFirstInfo"></div></div><div class="round-correct-item"><label>修改首班岗日期</label><input type="date" id="correctFirstDate"></div><div class="round-correct-item"><label>修改首班岗时段</label><select id="correctFirstShift"></select></div><div class="round-correct-item"><label>或直接设置当前轮次</label><input type="number" id="correctRoundNum" placeholder="输入轮次数字" step="1" min="1"><div class="hint">设置后系统会从该轮次的第一天开始重新计算</div></div><button class="btn btn-primary" onclick="applyRoundCorrection()">应用修正并重算</button><button class="btn btn-outline btn-sm" onclick="closeRoundCorrector()">取消</button></div></div>
    <div class="modal" id="actionModal"><div class="modal-box"><div class="handle"></div><h3 id="actionTitle">日期操作</h3><p id="actionDate"></p><div class="action-sheet" id="actionContent"></div><button class="btn btn-outline btn-sm" onclick="closeActionModal()" style="margin-top:12px;">取消</button></div></div>
    <div class="modal result-modal" id="resultModal"><div class="modal-box"><div class="handle"></div><div class="result-icon">✅</div><div class="result-title" id="resultTitle">打卡成功！</div><div class="result-detail" id="resultDetail"></div><hr class="quote-divider"><div class="quote-text" id="quoteText"></div><div class="quote-author" id="quoteAuthor"></div><button class="btn btn-primary" onclick="closeResultModal()" style="margin-top:16px;">好的</button></div></div>
    <div class="modal" id="planManagerModal"><div class="modal-box"><div class="handle"></div><h3>排班方案管理</h3><p>当前激活的方案会用于打卡计算</p><div id="planList"></div><button class="btn btn-primary" onclick="createNewPlan()">+ 新建方案</button><button class="btn btn-outline btn-sm" onclick="closePlanManager()">关闭</button></div></div>
    <div class="modal" id="editPlanModal"><div class="modal-box"><div class="handle"></div><h3 id="editPlanTitle">编辑方案</h3><label>方案名称</label><input type="text" id="planName" placeholder="方案名称"><label>生效日期</label><input type="date" id="planEffectiveDate"><div class="hint">生效日期仅用于标识，不影响打卡计算。轮次计算基于首班岗设置。</div><label>排班配置</label><div class="schedule-editor" id="planScheduleEditor"></div><button class="btn btn-primary" onclick="saveCurrentPlan()">保存方案</button><button class="btn btn-outline btn-sm" onclick="closeEditPlanModal()">取消</button></div></div>
    <div class="modal" id="switchConfirmModal"><div class="modal-box"><div class="handle"></div><h3>切换排班方案</h3><div id="switchConfirmContent"></div><div class="btn-row" id="switchConfirmButtons"></div><button class="btn btn-outline btn-sm" onclick="closeSwitchConfirm()" style="margin-top:12px;">取消</button></div></div>

    <script>

        ];
        var QUOTES_USED = [];
        
        // ==================== 全局变量 ====================
        var S = { target: 24, firstDate: "", firstShift: "", recs: [], news: [], setup: false, manualHolidays: {}, blockedShifts: {}, vacationDays: {}, manualWorkdayWeekends: {} };
        var EXPANDED = false;
        var currentPlanId = "default";
        var plans = {};
        var pendingSwitchPlanId = null;
        var editingPlanId = null;
        var currentDaily = {};

        function getRate(ds) { if (isVacation(ds)) return 0; if (isHoliday(ds)) return HOLIDAY_RATE; if (isWorkdayWeekend(ds)) return WEEKDAY_RATE; return we(ds) ? WEEKEND_RATE : WEEKDAY_RATE; }
        function getRateLabel(ds) { if (isVacation(ds)) return '休假 0元/h'; if (isHoliday(ds)) return '节假日 ' + getRate(ds) + '元/h'; if (isWorkdayWeekend(ds)) return '调休上班 ' + getRate(ds) + '元/h'; return we(ds) ? '周末 ' + getRate(ds) + '元/h' : '普通 ' + getRate(ds) + '元/h'; }

        function getAvailableShiftsForDate(ds) {
            var allShifts = getTodayShifts(ds);
            var blocked = S.blockedShifts[ds] || {};
            var rec = null;
            for (var i = 0; i < S.recs.length; i++) if (S.recs[i].d === ds) { rec = S.recs[i]; break; }
            if (!rec) for (var i = 0; i < S.news.length; i++) if (S.news[i].d === ds) { rec = S.news[i]; break; }
            var doneShifts = rec ? rec.s : [];
            var available = [];

        // ==================== 打卡核心 ====================
        function clockIn() {
            if (!S.setup) { openSettings(); return; }
            
            var nowTime = now();
            var td = fd(nowTime);
            var currentMin = toMinutes(ffTime(nowTime));
            var allMissing = [];
            
            var startDate = new Date(S.firstDate + "T12:00:00+08:00");
            var endDate = new Date(td + "T12:00:00+08:00");
            
            for (var d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                var ds = fd(d);
                if (isVacation(ds)) continue;
                var available = getAvailableShiftsForDate(ds);
                
                for (var i = 0; i < available.length; i++) {
                    var shift = available[i];
                    var startTime = shift.shift.split('-')[0];
                    var endTime = shift.shift.split('-')[1];
                    var startMin = toMinutes(startTime);
                    var endMin = toMinutes(endTime);
                    
                    if (ds < td) {
                        allMissing.push(shift);
                    } else if (ds === td) {
                        if (currentMin >= endMin) {
                            allMissing.push(shift);
                        } else if (currentMin >= startMin && currentMin < endMin) {
                            allMissing.push(shift);
                        } else if (startMin > currentMin && (startMin - currentMin) <= 60) {
                            allMissing.push(shift);
                        }
                    }
                }
            }
            
            if (allMissing.length === 0) {
                toast('暂无待打卡岗');
                return;
            }
            
            // 找出最后一天的日期
            var maxDate = '';
            for (var i = 0; i < allMissing.length; i++) {
                if (allMissing[i].date > maxDate) maxDate = allMissing[i].date;
            }
            
            // 只取最后一天的岗
            var lastDayShifts = [];
            for (var i = 0; i < allMissing.length; i++) {
                if (allMissing[i].date === maxDate) lastDayShifts.push(allMissing[i]);
            }
            
            // 补所有缺卡（全部保存）
            doIt(allMissing);
            
            // 弹窗只显示最后一天的岗
            showResultModal(lastDayShifts);
        }
        
        function doIt(shifts) {
            var n = now(), groups = {};
            for (var i = 0; i < shifts.length; i++) {
                var s = shifts[i];
                if (!groups[s.date]) groups[s.date] = [];
                var found = false;
                for (var j = 0; j < groups[s.date].length; j++) if (groups[s.date][j].shift === s.shift) { found = true; break; }
                if (!found) groups[s.date].push(s);
            }
            var dates = Object.keys(groups);
            for (var di = 0; di < dates.length; di++) {
                var ds = dates[di], lst = groups[ds];
                var existing = null;
                for (var i = 0; i < S.news.length; i++) if (S.news[i].d === ds) { existing = S.news[i]; break; }
                if (!existing) for (var i = 0; i < S.recs.length; i++) if (S.recs[i].d === ds) { existing = S.recs[i]; break; }
                if (existing) {
                    for (var li = 0; li < lst.length; li++) if (existing.s.indexOf(lst[li].shift) < 0) existing.s.push(lst[li].shift);
                    existing.s.sort();
                    existing.h = 0;
                    for (var si = 0; si < existing.s.length; si++) existing.h += getShiftHours(existing.s[si]);
                    existing.r = getRate(ds);
                    existing.a = existing.h * existing.r;
                    existing.w = wk(ds);
                    existing.t = getDayTypeForDate(ds);
                } else {
                    var totalH = 0, shiftNames = [];
                    for (var li = 0; li < lst.length; li++) { totalH += lst[li].hours; shiftNames.push(lst[li].shift); }
                    shiftNames.sort();
                    S.news.push({ d: ds, w: wk(ds), s: shiftNames, h: totalH, r: getRate(ds), a: totalH * getRate(ds), t: getDayTypeForDate(ds), ts: n.getTime() });
                }
            }
            save(); update();
        }

        function getRoundInfo() {

        function getRoundWorkedHours(roundNum) {

            var round = currentRound(), worked = getRoundWorkedHours(round), left = Math.max(0, S.target - worked), pct = Math.min((worked / S.target) * 100, 100);

        function save() { try { localStorage.setItem('clockin_v23', JSON.stringify({ target: S.target, firstDate: S.firstDate, firstShift: S.firstShift, recs: S.recs, news: S.news, setup: S.setup, manualHolidays: S.manualHolidays, blockedShifts: S.blockedShifts, vacationDays: S.vacationDays, manualWorkdayWeekends: S.manualWorkdayWeekends })); } catch(e) {} }
        function load() {
            try { var raw = localStorage.getItem('clockin_v23'); if (raw) { var d = JSON.parse(raw); S.target = d.target || 24; S.firstDate = d.firstDate || ""; S.firstShift = d.firstShift || ""; S.recs = d.recs || []; S.news = d.news || []; S.setup = d.setup !== undefined ? d.setup : false; S.manualHolidays = d.manualHolidays || {}; S.blockedShifts = d.blockedShifts || {}; S.vacationDays = d.vacationDays || {}; S.manualWorkdayWeekends = d.manualWorkdayWeekends || {}; } else { S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; } } catch(e) { S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; } }
        function validate() {
            var all = allRecords(), changed = false;
            for (var i = 0; i < all.length; i++) {
                var r = all[i], newW = wk(r.d), newRate = getRate(r.d), newDtype = getDayTypeForDate(r.d);
                if (r.w !== newW) { r.w = newW; changed = true; }
                if (r.r !== newRate) { r.r = newRate; r.a = r.h * newRate; changed = true; }
                if (r.t !== newDtype) { r.t = newDtype; changed = true; }
            }
            if (changed) save();
        }
        
        // ==================== 设置相关 ====================
        function openSettings() {
            if (S.firstDate) document.getElementById('sDate').value = S.firstDate;
            else document.getElementById('sDate').value = fd(now());
            rebuildFirstShiftSelect();
            if (S.firstShift) document.getElementById('sShift').value = S.firstShift;
            document.getElementById('sTarget').value = S.target;
            updateShiftHint();
            document.getElementById('modal').classList.add('on');
        }
        function closeSettings() { document.getElementById('modal').classList.remove('on'); }
        function updateShiftHint() { var ss = document.getElementById('sShift').value; var dt = shiftToDType(ss); document.getElementById('shiftHint').textContent = '第1轮第1岗 · ' + dt + ' 开始'; }
        function saveSettings() {
            var d = document.getElementById('sDate').value;
            var ss = document.getElementById('sShift').value;
            var t = parseInt(document.getElementById('sTarget').value);
            if (!d) { toast('请选择日期'); return; }
            if (!ss) { toast('请选择岗时间'); return; }
            if (isNaN(t) || t < 1) { toast('请输入有效目标'); return; }
            
            var wasSetup = S.setup;
            S.firstDate = d;
            S.firstShift = ss;
            S.target = t;
            S.setup = true;
            
            if (!wasSetup) {
                S.recs = [];
                S.news = [];
                S.manualHolidays = {};
                S.blockedShifts = {};
                S.vacationDays = {};
                S.manualWorkdayWeekends = {};
                toast('首班岗已设置，打卡记录已初始化');
            } else {
                validate();
                toast('首班岗已更新，打卡记录已重新计算');
            }
            save();
            update();
            closeSettings();
        }
        function openSettingsMenu() { document.getElementById('settingsMenuModal').classList.add('on'); }
        function closeSettingsMenu() { document.getElementById('settingsMenuModal').classList.remove('on'); }
        function openSettingsFromMenu() { closeSettingsMenu(); openSettings(); }
        function resetAll() {
            if (confirm('确定要清空所有打卡数据吗？此操作不可恢复。')) {
                S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {};
                S.firstDate = ""; S.firstShift = ""; S.target = 24; QUOTES_USED = []; EXPANDED = false;
                save(); validate(); update(); closeSettingsMenu(); toast('已清空');
            }
        }
        
        // ==================== 轮次修正 ====================
        function openRoundCorrector() {
            document.getElementById('currentFirstInfo').textContent = (S.firstDate ? S.firstDate + ' ' + S.firstShift : '未设置') + '，当前轮次：第' + currentRound() + '轮';
            document.getElementById('correctFirstDate').value = S.firstDate || fd(now());
            rebuildCorrectShiftSelect();
            if (S.firstShift) document.getElementById('correctFirstShift').value = S.firstShift;
            document.getElementById('correctRoundNum').value = '';
            document.getElementById('roundCorrectorModal').classList.add('on');
            closeSettingsMenu();
        }
        function rebuildCorrectShiftSelect() {
            var select = document.getElementById('correctFirstShift');
            if (!select) return;
            var allShifts = [];
            for (var dtype in currentDaily) for (var i = 0; i < currentDaily[dtype].length; i++) if (allShifts.indexOf(currentDaily[dtype][i]) === -1) allShifts.push(currentDaily[dtype][i]);
            select.innerHTML = '';
            for (var j = 0; j < allShifts.length; j++) select.appendChild(new Option(allShifts[j] + ' (' + getShiftHours(allShifts[j]).toFixed(1) + 'h)', allShifts[j]));
        }
        function applyRoundCorrection() {
            var newFirstDate = document.getElementById('correctFirstDate').value;
            var newFirstShift = document.getElementById('correctFirstShift').value;
            var newRoundNum = document.getElementById('correctRoundNum').value;
            if (newRoundNum && !isNaN(parseInt(newRoundNum))) {
                var targetRound = parseInt(newRoundNum), currentR = currentRound();
                if (targetRound !== currentR) {
                    var base = new Date(S.firstDate + "T12:00:00+08:00");
                    base.setDate(base.getDate() + (targetRound - currentR) * 5);
                    S.firstDate = fd(base);
                    toast('已调整首班岗日期到 ' + S.firstDate);
                } else toast('当前已是第 ' + targetRound + ' 轮');
            } else if (newFirstDate && newFirstShift) {
                S.firstDate = newFirstDate;
                S.firstShift = newFirstShift;
                toast('首班岗已更新');
            } else { toast('请填写修改内容'); return; }
            validate(); update(); closeRoundCorrector();
        }
        function closeRoundCorrector() { document.getElementById('roundCorrectorModal').classList.remove('on'); }
        
        // ==================== 排班方案管理 ====================
        function openPlanManager() { renderPlanList(); document.getElementById('planManagerModal').classList.add('on'); closeSettingsMenu(); }
        function closePlanManager() { document.getElementById('planManagerModal').classList.remove('on'); }
        function renderPlanList() {
            var container = document.getElementById('planList'), html = '';
            for (var id in plans) {
                var plan = plans[id], isActive = (currentPlanId === id);
                html += '<div class="plan-item"><div class="plan-header"><span class="plan-name">' + escapeHtml(plan.name) + '</span>' + (isActive ? '<span class="plan-badge active">当前激活</span>' : '') + '</div>';
                html += '<div class="plan-info">生效日期：' + plan.effectiveDate + '</div><div class="plan-actions">';
                if (!isActive) html += '<button onclick="prepareSwitchPlan(\'' + id + '\')">切换</button>';
                html += '<button onclick="editPlan(\'' + id + '\')">编辑</button>';
                if (id !== 'default') html += '<button onclick="deletePlan(\'' + id + '\')" style="color:var(--red);">删除</button>';
                html += '</div></div>';
            }
            container.innerHTML = html;
        }
        function createNewPlan() {
            var newId = 'plan_' + Date.now(), newName = '排班方案' + (Object.keys(plans).length);
            plans[newId] = { id: newId, name: newName, effectiveDate: fd(now()), daily: JSON.parse(JSON.stringify(DEFAULT_PLAN.daily)), shifts: buildShiftsFromDaily(DEFAULT_PLAN.daily) };
            savePlans(); editPlan(newId);
        }
        function editPlan(planId) {
            editingPlanId = planId;
            var plan = plans[planId];
            document.getElementById('editPlanTitle').textContent = planId === 'default' ? '编辑默认方案' : '编辑方案';
            document.getElementById('planName').value = plan.name;
            document.getElementById('planEffectiveDate').value = plan.effectiveDate;
            renderPlanScheduleEditor(plan.daily);
            document.getElementById('editPlanModal').classList.add('on');
            closePlanManager();
        }
        function renderPlanScheduleEditor(daily) {
            var container = document.getElementById('planScheduleEditor'), html = '';
            for (var i = 0; i < DTYPES.length; i++) {
                var dtype = DTYPES[i], shifts = daily[dtype] || [];
                html += '<div class="dtype-section"><div class="dtype-header">' + dtype + '</div><div id="edit-shifts-' + dtype + '">';
                for (var j = 0; j < shifts.length; j++) {
                    var parts = shifts[j].split('-'), start = parts[0] || '', end = parts[1] || '', hours = getShiftHours(shifts[j]);
                    if (hours === 0) hours = calcHours(start, end);
                    html += '<div class="shift-item" data-dtype="' + dtype + '"><input type="time" class="shift-start" value="' + start + '" style="flex:1;"><span>~</span><input type="time" class="shift-end" value="' + end + '" style="flex:1;">';
                    html += '<input type="number" class="shift-hours" value="' + hours.toFixed(1) + '" step="0.1" style="width:70px;"><button onclick="removeEditShiftItem(this)">删</button></div>';
                }
                html += '</div><button class="add-shift-btn" onclick="addEditShiftItem(\'' + dtype + '\')">+ 增加时段</button></div>';
            }
            container.innerHTML = html;
        }
        function addEditShiftItem(dtype) {
            var container = document.getElementById('edit-shifts-' + dtype);
            if (!container) return;
            var newItem = document.createElement('div'); newItem.className = 'shift-item';
            newItem.innerHTML = '<input type="time" class="shift-start" value="00:00" style="flex:1;"><span>~</span><input type="time" class="shift-end" value="01:00" style="flex:1;"><input type="number" class="shift-hours" value="1.0" step="0.1" style="width:70px;"><button onclick="removeEditShiftItem(this)">删</button>';
            container.appendChild(newItem);
        }
        function removeEditShiftItem(btn) { var item = btn.closest('.shift-item'); if (item) item.remove(); }
        function collectEditPlanDaily() {
            var newDaily = {}, sections = document.querySelectorAll('#planScheduleEditor .dtype-section');
            for (var i = 0; i < sections.length; i++) {
                var section = sections[i], dtype = section.querySelector('.dtype-header').innerText.trim(), items = section.querySelectorAll('.shift-item'), list = [];
                for (var j = 0; j < items.length; j++) {
                    var start = items[j].querySelector('.shift-start').value, end = items[j].querySelector('.shift-end').value;
                    if (start && end) list.push(start + '-' + end);
                }
                newDaily[dtype] = list;
            }
            return newDaily;
        }
        function saveCurrentPlan() {
            var name = document.getElementById('planName').value.trim();
            if (!name) { toast('请输入方案名称'); return; }
            var effective = document.getElementById('planEffectiveDate').value;
            if (!effective) { toast('请选择生效日期'); return; }
            var newDaily = collectEditPlanDaily();
            var newShifts = buildShiftsFromDaily(newDaily);
            plans[editingPlanId].name = name;
            plans[editingPlanId].effectiveDate = effective;
            plans[editingPlanId].daily = newDaily;
            plans[editingPlanId].shifts = newShifts;
            savePlans();
            if (currentPlanId === editingPlanId) { loadCurrentPlan(); validate(); update(); rebuildFirstShiftSelect(); }
            closeEditPlanModal();
            toast('方案已保存');
        }
        function closeEditPlanModal() { document.getElementById('editPlanModal').classList.remove('on'); editingPlanId = null; }
        function deletePlan(planId) {
            if (planId === 'default') { toast('默认方案不可删除'); return; }
            if (confirm('确定删除「' + plans[planId].name + '」吗？')) {
                delete plans[planId];
                if (currentPlanId === planId) { currentPlanId = 'default'; loadCurrentPlan(); validate(); update(); rebuildFirstShiftSelect(); }
                savePlans(); renderPlanList(); toast('已删除');
            }
        }
        function prepareSwitchPlan(planId) {
            var plan = plans[planId];
            document.getElementById('switchConfirmContent').innerHTML = '<div class="confirm-box">⚠️ 切换到「' + escapeHtml(plan.name) + '」</div><p style="font-size:13px;">切换后，所有打卡记录将按新排班重新计算Dtype和费率。</p>';
            document.getElementById('switchConfirmButtons').innerHTML = '<button class="btn btn-primary" onclick="confirmSwitchPlan(\'' + planId + '\')">确认切换</button>';
            pendingSwitchPlanId = planId;
            document.getElementById('switchConfirmModal').classList.add('on');
            closePlanManager();
        }
        function confirmSwitchPlan(planId) {
            var plan = plans[planId];
            var newShifts = [];
            for (var dtype in plan.daily) for (var i = 0; i < plan.daily[dtype].length; i++) newShifts.push(plan.daily[dtype][i]);
            if (newShifts.indexOf(S.firstShift) === -1 && newShifts.length > 0) { toast('首班岗已自动调整为「' + newShifts[0] + '」'); S.firstShift = newShifts[0]; }
            currentPlanId = planId;
            loadCurrentPlan();
            savePlans();
            validate(); update(); rebuildFirstShiftSelect();
            toast('已切换到「' + plan.name + '」');
            closeSwitchConfirm();
        }
        function closeSwitchConfirm() { document.getElementById('switchConfirmModal').classList.remove('on'); pendingSwitchPlanId = null; }
        function rebuildFirstShiftSelect() {
            var select = document.getElementById('sShift');
            if (!select) return;
            var allShifts = [];
            for (var dtype in currentDaily) for (var i = 0; i < currentDaily[dtype].length; i++) if (allShifts.indexOf(currentDaily[dtype][i]) === -1) allShifts.push(currentDaily[dtype][i]);
            select.innerHTML = '';
            for (var j = 0; j < allShifts.length; j++) select.appendChild(new Option(allShifts[j] + ' (' + getShiftHours(allShifts[j]).toFixed(1) + 'h)', allShifts[j]));
            if (S.firstShift && allShifts.indexOf(S.firstShift) !== -1) select.value = S.firstShift;
            else if (allShifts.length > 0) select.value = allShifts[0];
            updateShiftHint();
        }
        
        function closeResultModal() { document.getElementById('resultModal').classList.remove('on'); }
        
        // ==================== 初始化 ====================
        document.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeSettings();
            if (e.target === document.getElementById('actionModal')) closeActionModal();
            if (e.target === document.getElementById('settingsMenuModal')) closeSettingsMenu();
            if (e.target === document.getElementById('resultModal')) closeResultModal();
            if (e.target === document.getElementById('planManagerModal')) closePlanManager();
            if (e.target === document.getElementById('editPlanModal')) closeEditPlanModal();
            if (e.target === document.getElementById('switchConfirmModal')) closeSwitchConfirm();
            if (e.target === document.getElementById('roundCorrectorModal')) closeRoundCorrector();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettings(); closeActionModal(); closeSettingsMenu(); closeResultModal();
                closePlanManager(); closeEditPlanModal(); closeSwitchConfirm(); closeRoundCorrector();
            }
        });
        
        window.onload = function() {
            initPlans();
            load();
            if (!S.setup) {
                document.getElementById('days').textContent = '-';
                document.getElementById('hrs').textContent = '-';
                document.getElementById('amt').textContent = '-';
                document.getElementById('rnd').textContent = '-';
                document.getElementById('next').innerHTML = '<div class="empty">请先设置首班岗</div>';
            } else { validate(); update(); }
            rebuildFirstShiftSelect();
            var shiftSelect = document.getElementById('sShift');
            if (shiftSelect) shiftSelect.addEventListener('change', updateShiftHint);
        };
    </script>
</body>
</html>
