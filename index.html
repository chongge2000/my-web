<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>清醒</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'HarmonyOS Sans', sans-serif;
            background: #fff; color: #1a1a1a; min-height: 100vh;
            display: flex; justify-content: center;
        }
        .page {
            width: 100%; max-width: 500px; min-height: 100vh;
            padding: 0 20px 40px; display: flex; flex-direction: column; align-items: center;
        }
        .hidden { display: none !important; }
        * { -webkit-tap-highlight-color: transparent; }
        .btn, .option-btn, .icon-btn {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
        }
        .btn:focus, .option-btn:focus, .icon-btn:focus { outline: none; }

        .btn {
            width: 160px; padding: 14px 0; background: transparent;
            border: 1.5px solid #4a90d9; border-radius: 24px;
            font-size: 15px; font-weight: 600; color: #4a90d9;
            cursor: pointer; letter-spacing: 1px; text-align: center; transition: all 0.2s;
        }
        .btn:active { background: rgba(74,144,217,0.08); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .input-line {
            width: 100%; padding: 12px 0; border: none; border-bottom: 2px solid #e0e0e0;
            font-size: 16px; font-family: inherit; text-align: center;
            background: transparent; outline: none; transition: border-color 0.3s;
        }
        .input-line:focus { border-bottom-color: #4a90d9; }
        .text-area {
            width: 100%; padding: 14px 16px; background: #fafafa;
            border: 1.5px solid #e8e8e8; border-radius: 14px;
            font-size: 14px; font-family: inherit; resize: vertical;
            min-height: 90px; line-height: 1.6; outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .text-area:focus { border-color: #4a90d9; box-shadow: 0 0 0 3px rgba(74,144,217,0.08); }
        .text-area::placeholder { color: #c0c0c0; }

        .line-red { width: 40px; height: 3px; background: #c02020; border-radius: 2px; margin: 0 auto 20px; }
        .line-yellow { width: 40px; height: 2px; background: #e6b422; border-radius: 2px; margin: 20px auto; }

        .chat-msg {
            margin-bottom: 8px; padding: 10px 14px; font-size: 14px;
            line-height: 1.5; max-width: 85%; word-break: break-word; border-radius: 14px;
        }
        .chat-msg.ai { background: #f5f7fa; color: #333; margin-right: auto; border-bottom-left-radius: 4px; }
        .chat-msg.user { background: #4a90d9; color: #fff; margin-left: auto; border-bottom-right-radius: 4px; }

        .options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .option-btn {
            padding: 12px 16px; background: rgba(74,144,217,0.06);
            border: 1.5px solid #e0e0e0; border-radius: 12px;
            font-size: 14px; cursor: pointer; text-align: center;
            transition: all 0.2s; color: #333;

        .option-btn:active { border-color: #4a90d9; background: rgba(74,144,217,0.12); }
        .option-btn.selected { border-color: #4a90d9; background: rgba(74,144,217,0.18); color: #1a1a1a; font-weight: 600; }

        #chatHistory { max-height: 200px; overflow-y: auto; margin-bottom: 12px; }

        .result-container {

        }
        .result-header { text-align: center; margin-bottom: 24px; }
        .result-header .title-group {
            display: flex; align-items: baseline; justify-content: center; gap: 0;
            margin-bottom: 8px; position: relative;
        }
        .result-header .title-big {
            font-size: 72px; font-weight: 900; color: #1a1a1a;
            letter-spacing: 0; line-height: 1;
            transform: scaleX(0.85);
            margin-right: -12px;
            position: relative;
        }
        .result-header .title-big::after {
            content: '';
            position: absolute;
            top: 14px;
            left: 6px;
            width: 10px;
            height: 10px;
            background: #4a90d9;
            border-radius: 50%;
        }
        .result-header .title-small {

            transform: scaleX(1.1);
            margin-left: -8px;
            position: relative;

            left: -20px;

        .result-meta { text-align: center; font-size: 12px; color: #999; margin-bottom: 32px; }

        .result-label {

        .result-ending {

            color: #4a90d9; padding: 16px 0; margin: 20px 0 8px; letter-spacing: 1px;

            letter-spacing: 1px; transition: all 0.2s; display: inline-block; margin: 6px;

        .top-row .top-title .t-small {

            transform: scaleX(1.1); margin-left: -6px; position: relative;

        .top-row .top-title .t-small::after {

        .icon-btn {
            cursor: pointer; color: #bbb; transition: color 0.2s;

        }

        .header {
            height: 20vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; margin-top: 10px; width: 100%;
        }

        }
        .header .main-title .qing::after {

        .header .main-title .xing::after {

        .header .main-subtitle {

        .cards {

        }
        .card {
            background: rgba(74,144,217,0.12); border-radius: 18px;

        .card-label { font-size: 13px; color: #1a1a1a; }

        .btns { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 16px auto; width: 100%; }
        .btns-row { display: flex; gap: 16px; justify-content: center; }

        .question-header { width: 100%; text-align: center; margin-bottom: 8px; }
        .question-num { font-size: 13px; color: #999; letter-spacing: 1px; }
        .question-text {
            font-size: 17px; font-weight: 600; color: #1a1a1a;
            margin-bottom: 4px; line-height: 1.5;
        }
        .question-hint { font-size: 13px; color: #999; margin-bottom: 14px; }

        .custom-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .custom-modal-box {
            background: #fff; border-radius: 16px; padding: 24px 20px;
            width: 320px; max-height: 80vh; overflow-y: auto;
            text-align: left; line-height: 1.7; font-size: 13px; color: #333;
        }
        .custom-modal-box h3 { font-size: 17px; margin-bottom: 12px; color: #1a1a1a; text-align: center; }
        .custom-modal-box p { margin-bottom: 10px; }
        .custom-modal-box .modal-close-btn {
            display: block; margin: 16px auto 0; padding: 10px 30px;
            background: #4a90d9; color: #fff; border: none; border-radius: 20px;
            font-size: 14px; cursor: pointer;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center;
            z-index: 100;
        }
        .modal-box {
            background: #fff; border-radius: 16px; padding: 24px 20px;
            width: 280px; text-align: center;
        }
        .modal-box h3 { font-size: 17px; margin-bottom: 6px; color: #1a1a1a; }
        .modal-box p { font-size: 12px; color: #999; margin-bottom: 16px; }
        .modal-box input {
            width: 100%; padding: 10px 12px; border: 1.5px solid #e0e0e0;
            border-radius: 10px; font-size: 14px; text-align: center; outline: none; margin-bottom: 12px;
        }
        .modal-box input:focus { border-color: #4a90d9; }
        .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .modal-btn {
            padding: 8px 20px; border-radius: 20px; font-size: 13px; cursor: pointer;
            border: 1.5px solid #e0e0e0; background: #fff; color: #333; transition: all 0.2s;
        }
        .modal-btn.primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
        .modal-btn:active { opacity: 0.7; }
        .modal-error { color: #c02020; font-size: 12px; margin-top: 8px; display: none; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

function shuffleArray(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function refreshTopicUI() {
    var total = getTotalQuestions();
    var cur = currentTopicIndex;
    var curTopic = getCurrentTopic();
    if (!curTopic) { currentTopicIndex = 0; return refreshTopicUI(); }
    var hasOptions = curTopic.options && Array.isArray(curTopic.options) && curTopic.options.length > 0;

    var label = (mode === 'deep') ? '第 ' + (cur + 1) + ' 段对话' : '第 ' + (cur + 1) + ' 题';
    document.getElementById('questionNum').textContent = label;
    document.getElementById('questionText').textContent = curTopic.q;
    document.getElementById('questionHint').textContent = curTopic.hint || '';

    if (hasOptions) {
        document.getElementById('answerInput').style.display = 'none';
        document.getElementById('chatHistory').style.display = 'none';
    } else {
        document.getElementById('answerInput').style.display = 'block';
        document.getElementById('chatHistory').style.display = 'block';
        document.getElementById('answerInput').value = '';
        if (mode === 'deep') { loadCurrentChatHistory(); restoreFollowUps(); }
    }

    var followUpArea = document.getElementById('followUpArea');

    if (hasOptions) {
        followUpArea.innerHTML = '<div class="options-list"></div>';
        var list = followUpArea.querySelector('.options-list');
        curTopic.options.forEach(function(opt, idx) {
            var btn = document.createElement('div');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.addEventListener('click', function() {
                if (mode === 'quick') {
                    window._trapAnswers[currentTopicIndex] = idx;
                    var allDone = true;
                    for (var i = 0; i < quickFullTopics.length; i++) {
                        if (window._trapAnswers[i] === undefined) { allDone = false; break; }
                    }
                    if (allDone) { collectQuickAnswers(); submitYinji(); }
                    else if (currentTopicIndex < total - 1) { currentTopicIndex++; refreshTopicUI(); }
                }
            });
            list.appendChild(btn);
        });
    } else {
        followUpArea.innerHTML = '';
        if (mode === 'deep') restoreFollowUps();
    }

    var isLast = cur === total - 1;
    if (mode === 'quick') {
        document.getElementById('confirmBtn').textContent = isLast ? '提交' : '下一题';
        document.getElementById('confirmBtn').classList.remove('hidden');
        document.getElementById('confirmBtn').style.display = (hasOptions && !isLast) ? 'none' : 'inline-block';
    } else {
        document.getElementById('confirmBtn').textContent = isLast ? '提交' : '确 定';
        document.getElementById('confirmBtn').classList.remove('hidden');
        document.getElementById('confirmBtn').style.display = 'inline-block';
    }
}

var touchStartX = 0;
function initSwipe() {
    if (swipeInited) return;
    swipeInited = true;
    var screen = document.getElementById('mainPage');
    screen.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; });
    screen.addEventListener('touchend', function(e) {
        var diff = touchStartX - e.changedTouches[0].screenX;
        if (Math.abs(diff) < 60) return;
        var total = getTotalQuestions();
        if (diff > 0 && currentTopicIndex < total - 1) {
            if (mode === 'deep') saveCurrentChatHistory();
            currentTopicIndex++; refreshTopicUI();
        } else if (diff < 0 && currentTopicIndex > 0) {
            if (mode === 'deep') saveCurrentChatHistory();
            currentTopicIndex--; refreshTopicUI();
        }
    });
}

function saveCurrentChatHistory() {
    const chatDiv = document.getElementById('chatHistory');
    if (!chatDiv) return;
    const messages = [];
    chatDiv.querySelectorAll('.chat-msg').forEach(msg => {
        messages.push({ type: msg.classList.contains('user') ? 'user' : 'ai', text: msg.textContent });
    });
    if (messages.length > 0) { chatHistories[currentTopicIndex] = messages; }
}

function loadCurrentChatHistory() {
    const chatDiv = document.getElementById('chatHistory');
    if (!chatDiv) return;
    chatDiv.innerHTML = '';
    const messages = chatHistories[currentTopicIndex] || [];
    messages.forEach(msg => { appendChatToDiv(chatDiv, msg.type, msg.text); });
    chatDiv.scrollTop = chatDiv.scrollHeight;
}

function appendChatToDiv(div, type, text) {
    const msg = document.createElement('div');
    msg.className = 'chat-msg ' + type;
    msg.textContent = text;
    div.appendChild(msg);
}

function appendChat(type, text) {
    const chatDiv = document.getElementById('chatHistory');
    if (!chatDiv) return;
    appendChatToDiv(chatDiv, type, text);
    chatDiv.scrollTop = chatDiv.scrollHeight;
    if (!chatHistories[currentTopicIndex]) chatHistories[currentTopicIndex] = [];
    chatHistories[currentTopicIndex].push({ type, text });
}

function collectQuickAnswers() {
    for (var i = 0; i < quickFullTopics.length; i++) {
        var ans = window._trapAnswers[i];
        if (ans !== undefined && quickFullTopics[i].options) { answers[i] = quickFullTopics[i].options[ans]; }
        else if (ans !== undefined) { answers[i] = ans; }
        else { answers[i] = ''; }
    }
}

function restoreFollowUps() {
    var followUpArea = document.getElementById('followUpArea');
    var cur = currentTopicIndex;
    var saved = followUpAnswers[cur];
    if (saved && saved.questions && saved.questions.length > 0) {
        followUpArea.innerHTML = '';
        saved.questions.forEach(function(fu, idx) {
            var div = document.createElement('div');
            div.style.cssText = 'margin-top:12px;padding:10px 12px;background:#fdf8f0;border-radius:10px;border-left:3px solid #c02020;animation:slideUp 0.35s ease;';
            div.innerHTML = '<p style="font-weight:600;font-size:13px;margin-bottom:4px;">' + fu.q + '</p>' +
            '<p style="font-size:11px;color:#999;margin-bottom:6px;">' + (fu.hint || '') + '</p>' +
            '<textarea class="text-area" style="min-height:50px;" placeholder="接着说说...">' + (saved[idx] || '') + '</textarea>';
            div.querySelector('textarea').addEventListener('input', function() { saveFollowUp(cur, idx, this.value); });
            followUpArea.appendChild(div);
        });
    }
}
function saveFollowUp(topicIdx, followIdx, value) {
    if (!followUpAnswers[topicIdx]) followUpAnswers[topicIdx] = {};
    followUpAnswers[topicIdx][followIdx] = value;
}

async function confirmAnswer() {
    var answerInput = document.getElementById('answerInput');
    var followUpArea = document.getElementById('followUpArea');
    followUpArea.querySelectorAll('textarea').forEach(function(ta, i) { saveFollowUp(currentTopicIndex, i, ta.value); });

    var cur = currentTopicIndex;
    var curTopic = getCurrentTopic();
    var total = getTotalQuestions();

    if (mode === 'quick') {
        var hasOptions = curTopic.options && Array.isArray(curTopic.options) && curTopic.options.length > 0;
        if (!hasOptions) {
            var openAnswer = answerInput.value.trim();
            if (!openAnswer) return;
            window._trapAnswers[cur] = openAnswer;
        }
        var allAnswered = true;
        for (var i = 0; i < quickFullTopics.length; i++) {
            if (window._trapAnswers[i] === undefined || window._trapAnswers[i] === '') { allAnswered = false; break; }
        }
        if (allAnswered) { collectQuickAnswers(); await submitYinji(); return; }
        if (cur < total - 1) { currentTopicIndex++; refreshTopicUI(); }
        return;
    }

    var userMsg = answerInput.value.trim();
    if (!userMsg) return;
    appendChat('user', userMsg);
    var questions = (followUpAnswers[cur] && followUpAnswers[cur].questions) || [];
    if (questions.length === 0) { answers[cur] = userMsg; }
    else { saveFollowUp(cur, questions.length, userMsg); }
    answerInput.value = '';

    if (!followUpCounts[cur]) followUpCounts[cur] = 0;
    followUpCounts[cur]++;

    var maxRounds = 2;
    if (userMsg.length < 20) maxRounds = 4;
    else if (userMsg.length < 60) maxRounds = 3;
    else maxRounds = 2;

    if (followUpCounts[cur] >= maxRounds) {
        followUpAnswers[cur]._done = true;
        appendChat('ai', '好的，我们继续下一段对话——');
        saveCurrentChatHistory();
        if (cur >= topics.length - 1) {
            document.getElementById('confirmBtn').textContent = '提交';
            document.getElementById('confirmBtn').classList.remove('hidden');
            document.getElementById('confirmBtn').style.display = 'inline-block';
        } else {
            setTimeout(function() { currentTopicIndex++; refreshTopicUI(); }, 600);
        }
        return;
    }

    var existingQs = questions.map(function(q) { return q.q; }).join('|');
    var previousSummary = '';
    if (cur > 0 && answers[cur-1]) {
        previousSummary = '前一题主题：' + topics[cur-1].q + '，回答：' + (answers[cur-1] || '').substring(0, 50);
    }
    var followUp = await generateOneFollowUp(answers[cur] || userMsg, curTopic.q, existingQs, userMsg, previousSummary);
    if (!followUpAnswers[cur]) followUpAnswers[cur] = { questions: [] };
    followUpAnswers[cur].questions.push(followUp);
    appendChat('ai', followUp.q);
    if (followUpAnswers[cur].questions.length >= maxRounds) { followUpAnswers[cur]._done = true; }
}

async function generateOneFollowUp(userAnswer, topic, existingQuestions, latestMsg, previousSummary) {
    try {
        var resp = await fetch('https://api.deepseek.com/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_API_KEY },
            body: JSON.stringify({
                model: 'deepseek-chat',
                messages: [{
                    role: 'system',
                    content: '你是清醒，基于唯物主义方法追问用户行为。追问行为细节，不问感受观点。已问过：' + (existingQuestions || '无') + (previousSummary ? '。' + previousSummary : '') + '。选一个角度：具体化、反向实例、身体反应、后果、对比。生成1道追问。返回JSON：{"q":"问题","hint":"提示"}。禁问"为什么""你觉得"。'
                }, { role: 'user', content: '主题：' + topic + '\n回答：' + userAnswer + '\n最新：' + latestMsg }],
                temperature: 0.85, max_tokens: 300
            })
        });
        var json = await resp.json();
        var text = json.choices[0].message.content;
        var match = text.match(/\{[\s\S]*\}/);
        if (match) return JSON.parse(match[0]);
    } catch (e) {}
    var fallbacks = [
        { q: '能说具体一点吗？', hint: '比如当时在哪儿、有谁在场。' },
        { q: '你当时身体有什么反应？', hint: '比如心跳加快、不想说话。' },
        { q: '后来呢？', hint: '之后发生了什么。' },
        { q: '有没有哪次是例外的？', hint: '类似的事，但处理方式不一样。' }
    ];
    return fallbacks[Math.floor(Math.random() * fallbacks.length)];
}

async function submitYinji() {
    if (mode === 'deep') {
        if (Object.keys(answers).length < topics.length) { alert('请先完成所有对话。'); return; }
        var shorts = ['没啥','不知道','还行','就那样','没什么','没有','还好','一般','不记得','忘了','嗯','哦'];
        var sc = 0;
        for (var i = 0; i < topics.length; i++) {
            var t = (answers[i] || '').trim();
            if (t.length <= 2 || shorts.indexOf(t) !== -1) sc++;
        }
        if (sc >= Math.floor(topics.length * 0.4)) {
            if (confirm('回答过于敷衍。确定返回继续答题？')) document.getElementById('answerInput')?.focus();
            return;
        }
    }

    stopTimer();
    localStorage.removeItem('qingxing_in_progress');
    document.getElementById('questionScreen').classList.add('hidden');
    var rs = document.getElementById('resultScreen');
    rs.style.display = 'block';
    rs.innerHTML = '<p style="text-align:center;color:#999;padding:60px 20px;">正在生成你的清醒报告……</p>';

    var payload = {
        nickname: nickname, mode: mode,
        topics: topics.map(function(t, i) {
            return { question: t.q, answer: answers[i] || '', followUps: followUpAnswers[i] || {} };
        })
    };

    var result;
    try { result = await callDeepSeek(payload); } catch (e) { result = 'API调用失败，请稍后重试。'; }

    var tag = extractTag(result);
    var data = getStorage();
    data.lastResult = { tag: tag, fullText: result, time: new Date().toLocaleString('zh-CN') };
    data.lastUpdateTime = data.lastResult.time;
    data.monthYinjiUsed++;
    data.history.push({ type: mode === 'deep' ? '深度模式' : '快速模式', tag: tag, time: data.lastResult.time, result: result });
    saveStorage(data);
    rs.innerHTML = renderResultPage(result);
}

function extractTag(text) {
    var lines = text.split('\n').filter(function(l) { return l.trim(); });
    return (lines[0] || '清醒').replace(/[\*#]/g, '').trim();
}

function renderResultPage(fullText) {
    var lines = fullText.split('\n').filter(function(l) { return l.trim(); });
    if (lines.length < 3) return '<div class="result-container"><p>' + fullText + '</p></div>';

    var labelLine = lines[0].replace(/[\*#]/g, '').trim();
    var openingItalic = lines[1].replace(/[\*_]/g, '').trim();
    var endingLine = '';
    if (lines.length > 3 && lines[lines.length-1].length <= 80 && lines[lines.length-1].indexOf('**') === -1) {
        endingLine = lines[lines.length-1].replace(/[\*_]/g, '').trim();
    }
    var bodyLines = lines.slice(2, endingLine ? lines.length-1 : lines.length);

    var bodyHtml = bodyLines.map(function(l) {
        return '<p>' + l.trim().replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>') + '</p>';
    }).join('');

    var now = new Date().toLocaleString('zh-CN');
    var h = '<div class="result-container">';
    h += '<div class="result-header"><div class="title-group"><span class="title-big">清</span><span class="title-small">醒</span></div><div class="subtitle">你的行为，比你更懂你</div></div>';
    h += '<div class="result-meta">代号：' + nickname + '&nbsp;&nbsp;|&nbsp;&nbsp;模式：' + (mode === 'deep' ? '深度模式' : '快速模式') + '&nbsp;&nbsp;|&nbsp;&nbsp;' + now + '</div>';
    h += '<div class="result-label">' + labelLine + '</div>';
    if (openingItalic) h += '<div class="result-italic">' + openingItalic + '</div>';
    h += '<div class="result-body">' + bodyHtml + '</div>';
    if (endingLine) h += '<div class="result-ending">' + endingLine + '</div>';
    h += '<div class="result-footer"><button class="btn-share" onclick="shareResult()">分享清醒</button><br><button class="btn" style="margin-top:12px;" onclick="showHome()">返回首页</button></div>';
    h += '</div>';
    return h;
}

function shareResult() {
    var text = '我的清醒报告：' + (getStorage()?.lastResult?.tag || '清醒');
    if (navigator.share) { navigator.share({ title: '清醒', text: text }); }
    else { alert('长按页面截图分享给朋友吧！'); }
}

function showHistory() {
    var data = getStorage();
    var rs = document.getElementById('resultScreen');
    document.getElementById('homeScreen').classList.add('hidden');
    document.getElementById('questionScreen').classList.add('hidden');
    rs.style.display = 'block';
    if (!data || data.history.length === 0) {
        rs.innerHTML = '<p style="text-align:center;color:#999;padding:40px;">暂无记录</p><div style="text-align:center;margin-top:10px;"><button class="btn" onclick="showHome()">返回</button></div>';
        return;
    }
    var html = '<div style="padding:20px;">';
    data.history.slice().reverse().forEach(function(item, i) {
        html += '<div style="padding:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;" onclick="viewHistory(' + (data.history.length-1-i) + ')">' +
        '<span style="font-weight:600;">' + (item.tag || '清醒') + '</span><span style="font-size:11px;color:#999;"> [' + item.type + '] ' + item.time + '</span></div>';
    });
    html += '</div><div style="text-align:center;margin-top:10px;"><button class="btn" onclick="showHome()">返回</button></div>';
    rs.innerHTML = html;
}
function viewHistory(index) {
    var data = getStorage();
    var item = data.history[index];
    if (!item) return;
    document.getElementById('resultScreen').innerHTML = renderResultPage(item.result);
}

async function callDeepSeek(context) {
    var fullPrompt = '根据行为数据分析行为模式和思想质地。模式：' + context.mode + '。数据：' + JSON.stringify(context.topics) + '\n\n' +
    '分析立场（核心）：\n' +
    '1. 你是唯物主义的分析者。从全部行为痕迹中，找出被测者自己可能没意识到的关联、矛盾、重复模式。\n' +
    '2. 严格区分"行为"和"叙事"。"做了什么"比"说了什么"有分量得多。快速模式的选择题反映的是自我认知倾向，不是真实行为——当多个维度的选项互相矛盾时，指出矛盾而非把选项当成行为事实。\n' +
    '3. 追问比初答更暴露真实模式，重视追问中的行为细节。\n' +
    '4. 必须给出有立场的定性判断——从行为链条里推导出这个人在关系里扮演什么角色、站在什么位置。\n' +
    '5. 不评价好坏、不给建议。只陈述行为事实和推导出的结论。\n' +
    '6. 用"你"称呼。\n' +
    '7. 结论要有锐度，像一把刀。快速模式的结果要有钩子——让人读完觉得还有一层没被说透，产生想继续挖的冲动。但绝不能说"想更了解自己吗"之类的话——钩子藏在内容里，不靠推销。\n\n' +
    '输出格式（严格按以下行数输出，每行之间用换行分隔）：\n' +
    '第1行：一句只属于这个人的定义性短句。格式是"[一段锐利描述]——一个……的人"。前面描述自由发挥，后面"一个……的人"是定性结论。不固定模板，不同的人前面描述不同。不要"你是一个"。\n' +
    '第2行：一句延伸解读金句。简短有力，不超过两行。是第一行的延伸，不是重复。\n' +
    '第3行起：一篇流畅的结论文章。5段左右，每段是短段落。用多维度交叉验证的方式——每一段都要至少跨越两个维度的行为，指出矛盾、一致、盲区。从一个模式切入，自然过渡到另一个，不要标注"矛盾""盲区""一致性"这类小标题。每段不超过3句话。总字数400-500字。\n' +
    '最后一行：一句有力的定性金句。加粗。从整个行为分析里长出来。简洁、有劲、能带走。\n\n' +
    '严格要求：\n- 禁止出现任何维度名称、题目编号\n- 禁止出现"你说""你提到""在……题中"等复述用语\n- 禁止出现"你的行为模式是""矛盾点：""一致性：""盲区："这类标注\n- 禁止逐题回应\n- 禁止抒情、讲道理\n- 结果是一篇完整文章，不是分析报告\n- 每个结论都是多维度交叉比对的结果\n- 快速模式选择题不是真实行为，是指向行为倾向的线索——用这些线索推导整体模式，不要把选项当事实陈述\n- ' + (context.mode === 'deep' ? '深度模式：精细深挖，数据多就多写。' : '快速模式：精炼有力，400-500字。有钩子但不推销。');

    var resp = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DEEPSEEK_API_KEY },
        body: JSON.stringify({
            model: 'deepseek-chat',
            messages: [
                { role: 'system', content: '你是清醒，基于唯物主义方法从行为痕迹推导一个人。给出有立场、有态度的定性分析。关键规则：不写分析过程，不给建议，不贴心理学标签，不逐题回应，不多维度分段标注。输出结果是一篇流畅的整体结论文章，像一篇锐利的评论。' },
                { role: 'user', content: fullPrompt }
            ],
            temperature: 0.85,
            max_tokens: context.mode === 'deep' ? 3000 : 1200
        })
    });
    if (!resp.ok) throw new Error('API error');
    var json = await resp.json();
    return json.choices[0].message.content;
}

(function() {
    var data = getStorage();
    if (data && data.nickname) { nickname = data.nickname; showHome(); }
})();
