<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>碎银几两 · 今日资讯</title>
    <style>
        :root {
            --bg: #f1f3f5;
            --card: #fff;
            --text: #1a1a1a;
            --sub: #999;
            --blue: #007dff;
            --teal: #00b386;
            --gold: #e6980a;
            --red: #e84040;
            --border: #e5e5e5;
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "HarmonyOS Sans", -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 16px 32px;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 32px 4px 12px;
            position: relative;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header .settings-icon {
            position: absolute;
            right: 4px;
            top: 32px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.15s;
            color: var(--sub);
            text-decoration: none;
        }
        .header .settings-icon:active {
            background: #f5f5f5;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .stat {
            text-align: center;
            padding: 4px 0;
        }
        .stat .val {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            display: block;
            line-height: 1.3;
        }
        .stat .lbl {
            font-size: 11px;
            color: var(--sub);
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .ring {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }
        .ring svg {
            transform: rotate(-90deg);
        }
        .ring .bg {
            fill: none;
            stroke: #e8e8e8;
            stroke-width: 15;
        }
        .ring .fg {
            fill: none;
            stroke: var(--blue);
            stroke-width: 15;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        .ring-text {
            font-size: 18px;
            font-weight: 700;
            fill: var(--text);
            text-anchor: middle;
            dominant-baseline: central;
            transform: rotate(90deg);
            transform-origin: 40px 40px;
        }
        .ring-pct {
            font-size: 11px;
            fill: var(--sub);
            text-anchor: middle;
            dominant-baseline: central;
            transform: rotate(90deg);
            transform-origin: 40px 40px;
        }
        .prog-info {
            flex: 1;
            font-size: 14px;
            line-height: 2;
            color: var(--sub);
        }
        .prog-info strong {
            color: var(--text);
            font-weight: 600;
        }
        .prog-info .encourage {
            color: var(--teal);
            font-weight: 500;
            font-size: 13px;
        }

        .companion-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .companion-card:active {
            background: #f8f8f8;
        }
        .companion-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .companion-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e8f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .companion-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .companion-desc {
            font-size: 11px;
            color: var(--sub);
            margin-top: 2px;
        }
        .companion-arrow {
            font-size: 16px;
            color: #ccc;
        }

        .article-modal .modal-box {
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px 22px 40px;
        }
        .article-modal .article-loading {
            text-align: center;
            padding: 40px 0;
            color: var(--sub);
            font-size: 14px;
        }
        .article-spinner {
            display: inline-block;
            width: 28px;
            height: 28px;
            border: 3px solid #e8e8e8;
            border-top-color: var(--blue);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .article-title {
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000;
            line-height: 1.5;
        }
        .article-body {
            font-size: 17px;
            line-height: 2;
            color: #000;
            text-align: justify;
        }
        .article-body .section-label {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            margin: 18px 0 10px 0;
            display: block;
            text-align: left;
        }
        .article-body .news-item {
            font-size: 17px;
            color: #000;
            margin-bottom: 12px;
            text-align: justify;
            padding-left: 4px;
            display: block;
        }
        .article-body .hl {
            font-weight: 700;
            display: inline;
            text-align: justify;
        }
        .article-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
            text-align: center;
        }
        .article-footer .btn {
            width: auto;
            padding: 10px 40px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn-clock {
            display: block;
            width: 80%;
            margin: 0 auto;
            padding: 22px 0;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            background: var(--blue);
            color: #fff;
            letter-spacing: 4px;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn-clock:active {
            opacity: 0.7;
        }
        .btn-outline {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 500;
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-row .btn {
            margin-bottom: 0;
        }
        .btn-sm {
            font-size: 14px;
            padding: 12px;
        }
        .next-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .next-item:last-child {
            border-bottom: none;
        }
        .next-item:active {
            background: #f8f8f8;
        }
        .next-item .nd {
            font-weight: 500;
            font-size: 14px;
        }
        .next-item .nt {
            font-size: 11px;
            color: var(--blue);
            background: #e8f2ff;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            font-weight: 600;
        }
        .next-item .ns {
            color: var(--teal);
            font-weight: 500;
            font-size: 13px;
            text-align: right;
            line-height: 1.5;
        }
        .next-item .ns .blocked-shift {
            text-decoration: line-through;
            color: #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            padding: 10px 8px;
            text-align: left;
            font-size: 11px;
            color: var(--sub);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            vertical-align: top;
        }
        tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }
        tbody tr:active {
            background: #f8f8f8;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-wd {
            background: #e8f8f0;
            color: #00b386;
        }
        .badge-we {
            background: #fef5e8;
            color: #e6980a;
        }
        .badge-hd {
            background: #ffe8e8;
            color: #e84040;
        }
        .badge-dt {
            background: #e8f2ff;
            color: var(--blue);
            font-size: 10px;
            font-weight: 600;
        }
        .row-blocked {
            opacity: 0.45;
        }
        .expand-btn {
            text-align: center;
            padding: 12px 0 4px;
            font-size: 13px;
            color: var(--blue);
            cursor: pointer;
            font-weight: 500;
        }
        .expand-btn:active {
            opacity: 0.6;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px);
            }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 998;
            align-items: flex-end;
            justify-content: center;
        }
        .modal.on {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 28px 22px 36px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }
        .modal-box p {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-box label {
            font-size: 12px;
            color: var(--sub);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            background: #f8f9fa;
            color: var(--text);
            appearance: none;
        }
        .modal-box input:focus,
        .modal-box select:focus {
            outline: none;
            border-color: var(--blue);
            background: #fff;
        }
        .modal-box .hint {
            font-size: 12px;
            color: var(--blue);
            margin-top: -8px;
            margin-bottom: 14px;
        }
        .modal-box .btn {
            margin-bottom: 8px;
        }
        .empty {
            text-align: center;
            padding: 32px 0;
            color: var(--sub);
            font-size: 14px;
        }
        .handle {
            width: 36px;
            height: 4px;
            background: #d5d5d5;
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .action-sheet {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-sheet .as-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }
        .action-sheet .as-btn:active {
            background: #f5f5f5;
        }
        .action-sheet .as-btn.holiday {
            color: #e84040;
            border-color: #e84040;
        }
        .action-sheet .as-btn.vacation {
            color: #e6980a;
            border-color: #e6980a;
        }
        .action-sheet .as-btn.workday {
            color: #e6980a;
            border-color: #e6980a;
        }
        .action-sheet .as-btn.cancel {
            color: var(--sub);
        }
        .action-sheet .as-shift-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .action-sheet .as-shift-row:last-child {
            border-bottom: none;
        }
        .action-sheet .as-shift-row span {
            flex: 1;
        }
        .action-sheet .as-shift-row .as-toggle {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fff;
            transition: all 0.15s;
        }
        .action-sheet .as-shift-row .as-toggle.blocked {
            background: #ffe8e8;
            color: #e84040;
            border-color: #e84040;
        }
        .action-sheet .as-shift-row .as-toggle.active {
            background: #e8f8f0;
            color: #00b386;
            border-color: #00b386;
        }
        .action-sheet .as-section-title {
            font-size: 12px;
            color: var(--sub);
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .result-modal .result-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .result-modal .result-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--teal);
            margin-bottom: 16px;
        }
        .result-modal .result-detail {
            font-size: 14px;
            line-height: 2;
            color: var(--text);
            margin-bottom: 16px;
            padding: 0 8px;
        }
        .result-modal .result-detail .day-group {
            margin-bottom: 8px;
        }
        .result-modal .result-detail .day-date {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .result-modal .result-detail .day-shifts {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .result-modal .result-detail .day-summary {
            font-weight: 600;
            color: #00b386;
        }
        .result-modal .quote-divider {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 20px 0;
        }
        .result-modal .quote-text {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.8;
            padding: 0 12px;
            letter-spacing: 0.5px;
        }
        .result-modal .quote-author {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #e84040;
            margin-top: 8px;
            padding-right: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>碎银几两</h1>
            <div class="settings-icon" onclick="openSettingsMenu()">⚙</div>
        </div>

        <div class="card">
            <div class="card-title">数据总览</div>
            <div class="stats">
                <div class="stat"><span class="val" id="days">0</span><span class="lbl">天数</span></div>
                <div class="stat"><span class="val" id="hrs">0</span><span class="lbl">时长/h</span></div>
                <div class="stat"><span class="val" id="amt">0</span><span class="lbl">金额</span></div>
                <div class="stat"><span class="val" id="rnd">1</span><span class="lbl">轮次</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">轮次进度</div>
            <div class="progress-row">
                <div class="ring">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                        <circle class="bg" cx="40" cy="40" r="30" />
                        <circle class="fg" id="ringFg" cx="40" cy="40" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" />
                        <text class="ring-text" x="40" y="37" id="ringPct">0</text>
                        <text class="ring-pct" x="40" y="48">%</text>
                    </svg>
                </div>
                <div class="prog-info">
                    第 <strong id="rNum">1</strong> 轮<br>
                    已完成 <strong id="rDone">0h</strong><br>
                    剩余 <strong id="rLeft">24h</strong><br>
                    <span class="encourage" id="encourage">千里之行，始于足下 🌱</span>
                </div>
            </div>
        </div>

        <div class="card companion-card" onclick="openCompanion()">
            <div class="companion-left">
                <div class="companion-icon">📰</div>
                <div class="companion-info">
                    <div class="companion-name">今日资讯</div>
                    <div class="companion-desc" id="companionDesc">点击查看今日要闻</div>
                </div>
            </div>
            <div class="companion-arrow">›</div>
        </div>

        <div class="card" style="padding-bottom:16px;">
            <button class="btn-clock" onclick="clockIn()">打个卡</button>
        </div>

        <div class="card">
            <div class="card-title">下一岗</div>
            <div id="next"></div>
        </div>

        <div class="card">
            <div class="card-title">记录</div>
            <div id="history"></div>
            <div id="expandArea"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3>首班岗设置</h3>
            <p>设置你开始上班的第一岗，系统自动推算轮次</p>
            <label>日期</label>
            <input type="date" id="sDate" value="2026-04-19">
            <label>岗时间</label>
            <select id="sShift">
                <option value="07:20-11:30">07:20-11:30 (D2)</option>
                <option value="11:30-14:30">11:30-14:30 (D3)</option>
                <option value="14:30-17:30">14:30-17:30 (D4)</option>
                <option value="17:30-20:00">17:30-20:00 (D3)</option>
                <option value="20:00-23:00" selected>20:00-23:00 (D1)</option>
                <option value="23:00-24:00">23:00-24:00 (D2)</option>
                <option value="00:00-02:00">00:00-02:00 (D3)</option>
                <option value="02:00-05:00">02:00-05:00 (D4)</option>
                <option value="05:00-07:20">05:00-07:20 (D5)</option>
            </select>
            <div class="hint" id="shiftHint">第1轮第1岗 · D1 开始</div>
            <label>轮目标（小时）</label>
            <input type="number" id="sTarget" value="24" min="1" max="100">
            <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            <button class="btn btn-outline btn-sm" onclick="closeSettings()">取消</button>
        </div>
    </div>

    <div class="modal" id="settingsMenuModal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3>设置</h3>
            <p>管理首班岗与数据</p>
            <button class="btn btn-outline" onclick="openSettingsFromMenu()">设置首班岗</button>
            <button class="btn btn-outline btn-sm" onclick="resetAll()" style="color:var(--red);border-color:var(--red);">清空所有打卡数据</button>
            <button class="btn btn-outline btn-sm" onclick="closeSettingsMenu()" style="margin-top:8px;">取消</button>
        </div>
    </div>

    <div class="modal" id="actionModal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3 id="actionTitle">日期操作</h3>
            <p id="actionDate"></p>
            <div class="action-sheet" id="actionContent"></div>
            <button class="btn btn-outline btn-sm" onclick="closeActionModal()" style="margin-top:12px;">取消</button>
        </div>
    </div>

    <div class="modal result-modal" id="resultModal">
        <div class="modal-box">
            <div class="handle"></div>
            <div class="result-icon">✅</div>
            <div class="result-title">打卡成功！</div>
            <div class="result-detail" id="resultDetail"></div>
            <hr class="quote-divider">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
            <button class="btn btn-primary" onclick="closeResultModal()" style="margin-top:16px;">好的</button>
        </div>
    </div>

    <div class="modal article-modal" id="articleModal">
        <div class="modal-box">
            <div class="handle"></div>
            <div id="articleContent"></div>
            <div class="article-footer">
                <button class="btn btn-outline" onclick="closeArticle()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var DS_API_KEY = 'sk-17577c7a517449d1bb12846864b17cc3';
        var DS_API_URL = 'https://api.deepseek.com/chat/completions';
        var ARTICLE_CACHE = {};

        function parseArticle(raw) {
            var cleaned = raw
                .replace(/^```[a-z]*\n?/gm, '')
                .replace(/```$/gm, '')
                .trim();

            var title = '';
            var titleMatch = cleaned.match(/【(.+?)】/);
            if (titleMatch) {
                title = titleMatch[0].trim();
                cleaned = cleaned.replace(/【.+?】/, '').trim();
            } else {
                var firstLine = cleaned.split('\n')[0];
                if (firstLine && firstLine.trim().length <= 40) {
                    title = firstLine.trim();
                    cleaned = cleaned.split('\n').slice(1).join('\n').trim();
                }
            }

            cleaned = cleaned.replace(/\*\*(.+?)\*\*/g, '<span class="hl">$1</span>');

            var lines = cleaned.split('\n');
            var bodyHtml = '';
            for (var i = 0; i < lines.length; i++) {
                var line = lines[i].trim();
                if (!line) {
                    bodyHtml += '<br>';
                    continue;
                }
                if (line === '🌍 国际' || line === '🇨🇳 国内' || line === '📍 襄阳' || line === '📍 本地') {
                    bodyHtml += '<span class="section-label">' + line + '</span>';
                } else {
                    bodyHtml += '<span class="news-item">' + line + '</span>';
                }
            }

            return { title: title, body: bodyHtml };
        }

        document.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeSettings();
            if (e.target === document.getElementById('actionModal')) closeActionModal();
            if (e.target === document.getElementById('settingsMenuModal')) closeSettingsMenu();
            if (e.target === document.getElementById('resultModal')) closeResultModal();
            if (e.target === document.getElementById('articleModal')) closeArticle();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettings();
                closeActionModal();
                closeSettingsMenu();
                closeResultModal();
                closeArticle();
            }
        });

        window.onload = function() {
            load();
            loadArticleCache();
            if (!S.setup) {
                document.getElementById('days').textContent = '-';
                document.getElementById('hrs').textContent = '-';
                document.getElementById('amt').textContent = '-';
                document.getElementById('rnd').textContent = '-';
                document.getElementById('next').innerHTML = '<div class="empty">请先设置首班岗</div>';
            } else {
                validate();
                update();
            }
            updateCompanionDesc();
            setTimeout(function() { preloadArticle(); }, 500);
        };
    </script>
</body>
</html>
