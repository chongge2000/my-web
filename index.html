<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>碎银几两 · 打卡助手</title>
    <style>
        :root {
            --bg: #f1f3f5;
            --card: #fff;
            --text: #1a1a1a;
            --sub: #999;
            --blue: #007dff;
            --teal: #00b386;
            --gold: #e6980a;
            --red: #e84040;
            --border: #e5e5e5;
            --radius: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "HarmonyOS Sans", -apple-system, "PingFang SC", sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0 16px 32px;
            -webkit-tap-highlight-color: transparent;
        }
        .container {
            max-width: 440px;
            margin: 0 auto;
            position: relative;
        }

        .header {
            text-align: center;
            padding: 32px 4px 12px;
            position: relative;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header .settings-icon {
            position: absolute;
            right: 4px;
            top: 32px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.15s;
            color: var(--sub);
            text-decoration: none;
        }
        .header .settings-icon:active {
            background: #f5f5f5;
        }

        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 12px;
        }
        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--sub);
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .stat {
            text-align: center;
            padding: 4px 0;
        }
        .stat .val {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            display: block;
            line-height: 1.3;
        }
        .stat .lbl {
            font-size: 11px;
            color: var(--sub);
        }
        .progress-row {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .ring {
            width: 80px;
            height: 80px;
            flex-shrink: 0;
        }
        .ring svg {
            transform: rotate(-90deg);
        }
        .ring .bg {
            fill: none;
            stroke: #e8e8e8;
            stroke-width: 15;
        }
        .ring .fg {
            fill: none;
            stroke: var(--blue);
            stroke-width: 15;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }
        .ring-text {
            font-size: 18px;
            font-weight: 700;
            fill: var(--text);
            text-anchor: middle;
            dominant-baseline: central;
            transform: rotate(90deg);
            transform-origin: 40px 40px;
        }
        .ring-pct {
            font-size: 11px;
            fill: var(--sub);
            text-anchor: middle;
            dominant-baseline: central;
            transform: rotate(90deg);
            transform-origin: 40px 40px;
        }
        .prog-info {
            flex: 1;
            font-size: 14px;
            line-height: 2;
            color: var(--sub);
        }
        .prog-info strong {
            color: var(--text);
            font-weight: 600;
        }
        .prog-info .encourage {
            color: var(--teal);
            font-weight: 500;
            font-size: 13px;
        }

        .slogan-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .slogan-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .slogan-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #e8f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .slogan-text {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 10px;
            transition: opacity 0.2s;
            letter-spacing: 0.5px;
        }
        .btn:active {
            opacity: 0.7;
        }
        .btn-clock {
            display: block;
            width: 80%;
            margin: 0 auto;
            padding: 22px 0;
            border: none;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            background: var(--blue);
            color: #fff;
            letter-spacing: 4px;
            transition: opacity 0.2s;
            text-align: center;
        }
        .btn-clock:active {
            opacity: 0.7;
        }
        .btn-outline {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            font-weight: 500;
        }
        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-row .btn {
            margin-bottom: 0;
        }
        .btn-sm {
            font-size: 14px;
            padding: 12px;
        }
        .next-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #f5f5f5;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.15s;
        }
        .next-item:last-child {
            border-bottom: none;
        }
        .next-item:active {
            background: #f8f8f8;
        }
        .next-item .nd {
            font-weight: 500;
            font-size: 14px;
        }
        .next-item .nt {
            font-size: 11px;
            color: var(--blue);
            background: #e8f2ff;
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 8px;
            font-weight: 600;
        }
        .next-item .ns {
            color: var(--teal);
            font-weight: 500;
            font-size: 13px;
            text-align: right;
            line-height: 1.5;
        }
        .next-item .ns .blocked-shift {
            text-decoration: line-through;
            color: #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th {
            padding: 10px 8px;
            text-align: left;
            font-size: 11px;
            color: var(--sub);
            font-weight: 500;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f5f5f5;
            font-size: 13px;
            vertical-align: top;
        }
        tbody tr {
            cursor: pointer;
            transition: background 0.15s;
        }
        tbody tr:active {
            background: #f8f8f8;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-wd {
            background: #e8f8f0;
            color: #00b386;
        }
        .badge-we {
            background: #fef5e8;
            color: #e6980a;
        }
        .badge-hd {
            background: #ffe8e8;
            color: #e84040;
        }
        .badge-dt {
            background: #e8f2ff;
            color: var(--blue);
            font-size: 10px;
            font-weight: 600;
        }
        .row-blocked {
            opacity: 0.45;
        }
        .expand-btn {
            text-align: center;
            padding: 12px 0 4px;
            font-size: 13px;
            color: var(--blue);
            cursor: pointer;
            font-weight: 500;
        }
        .expand-btn:active {
            opacity: 0.6;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 999;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-8px);
            }
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: 998;
            align-items: flex-end;
            justify-content: center;
        }
        .modal.on {
            display: flex;
        }
        .modal-box {
            background: #fff;
            border-radius: 20px 20px 0 0;
            padding: 28px 22px 36px;
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.3s ease;
            overflow-y: auto;
            max-height: 90vh;
        }
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }
        .modal-box h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 6px;
            text-align: center;
        }
        .modal-box p {
            font-size: 13px;
            color: var(--sub);
            margin-bottom: 20px;
            text-align: center;
        }
        .modal-box label {
            font-size: 12px;
            color: var(--sub);
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 14px;
            background: #f8f9fa;
            color: var(--text);
            appearance: none;
        }
        .modal-box input:focus,
        .modal-box select:focus {
            outline: none;
            border-color: var(--blue);
            background: #fff;
        }
        .modal-box .hint {
            font-size: 12px;
            color: var(--blue);
            margin-top: -8px;
            margin-bottom: 14px;
        }
        .modal-box .btn {
            margin-bottom: 8px;
        }
        .empty {
            text-align: center;
            padding: 32px 0;
            color: var(--sub);
            font-size: 14px;
        }
        .handle {
            width: 36px;
            height: 4px;
            background: #d5d5d5;
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .action-sheet {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .action-sheet .as-btn {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            transition: background 0.15s;
        }
        .action-sheet .as-btn:active {
            background: #f5f5f5;
        }
        .action-sheet .as-btn.holiday {
            color: #e84040;
            border-color: #e84040;
        }
        .action-sheet .as-btn.vacation {
            color: #e6980a;
            border-color: #e6980a;
        }
        .action-sheet .as-btn.workday {
            color: #e6980a;
            border-color: #e6980a;
        }
        .action-sheet .as-btn.cancel {
            color: var(--sub);
        }
        .action-sheet .as-shift-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 14px;
        }
        .action-sheet .as-shift-row:last-child {
            border-bottom: none;
        }
        .action-sheet .as-shift-row span {
            flex: 1;
        }
        .action-sheet .as-shift-row .as-toggle {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: #fff;
            transition: all 0.15s;
        }
        .action-sheet .as-shift-row .as-toggle.blocked {
            background: #ffe8e8;
            color: #e84040;
            border-color: #e84040;
        }
        .action-sheet .as-shift-row .as-toggle.active {
            background: #e8f8f0;
            color: #00b386;
            border-color: #00b386;
        }
        .action-sheet .as-section-title {
            font-size: 12px;
            color: var(--sub);
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        /* 排班编辑样式 */
        .schedule-editor {
            max-height: 70vh;
            overflow-y: auto;
        }
        .dtype-section {
            margin-bottom: 24px;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
        }
        .dtype-header {
            font-size: 16px;
            font-weight: 700;
            background: #f8f9fa;
            margin: -12px -12px 12px -12px;
            padding: 12px;
            border-radius: 12px 12px 0 0;
            border-bottom: 1px solid var(--border);
        }
        .shift-item {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .shift-item input {
            flex: 1;
            min-width: 70px;
            margin-bottom: 0;
        }
        .shift-item .shift-hours {
            width: 70px;
            text-align: center;
        }
        .shift-item button {
            background: #ffe8e8;
            border: none;
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--red);
            font-size: 12px;
            cursor: pointer;
        }
        .add-shift-btn {
            margin-top: 8px;
            background: #e8f2ff;
            border: none;
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            color: var(--blue);
            font-weight: 500;
            cursor: pointer;
        }

        .result-modal .result-icon {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }
        .result-modal .result-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: var(--teal);
            margin-bottom: 16px;
        }
        .result-modal .result-detail {
            font-size: 14px;
            line-height: 2;
            color: var(--text);
            margin-bottom: 16px;
            padding: 0 8px;
        }
        .result-modal .result-detail .day-group {
            margin-bottom: 8px;
        }
        .result-modal .result-detail .day-date {
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .result-modal .result-detail .day-shifts {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }
        .result-modal .result-detail .day-summary {
            font-weight: 600;
            color: #00b386;
        }
        .result-modal .quote-divider {
            border: none;
            border-top: 2px solid #e0e0e0;
            margin: 20px 0;
        }
        .result-modal .quote-text {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.8;
            padding: 0 12px;
            letter-spacing: 0.5px;
        }
        .result-modal .quote-author {
            text-align: right;
            font-size: 14px;
            font-weight: 600;
            color: #e84040;
            margin-top: 8px;
            padding-right: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>碎银几两</h1>
            <div class="settings-icon" onclick="openSettingsMenu()">⚙</div>
        </div>

        <div class="card">
            <div class="card-title">数据总览</div>
            <div class="stats">
                <div class="stat"><span class="val" id="days">0</span><span class="lbl">天数</span></div>
                <div class="stat"><span class="val" id="hrs">0</span><span class="lbl">时长/h</span></div>
                <div class="stat"><span class="val" id="amt">0</span><span class="lbl">金额</span></div>
                <div class="stat"><span class="val" id="rnd">1</span><span class="lbl">轮次</span></div>
            </div>
        </div>

        <div class="card">
            <div class="card-title">轮次进度</div>
            <div class="progress-row">
                <div class="ring">
                    <svg width="80" height="80" viewBox="0 0 80 80">
                        <circle class="bg" cx="40" cy="40" r="30" />
                        <circle class="fg" id="ringFg" cx="40" cy="40" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5" />
                        <text class="ring-text" x="40" y="37" id="ringPct">0</text>
                        <text class="ring-pct" x="40" y="48">%</text>
                    </svg>
                </div>
                <div class="prog-info">
                    第 <strong id="rNum">1</strong> 轮<br>
                    已完成 <strong id="rDone">0h</strong><br>
                    剩余 <strong id="rLeft">24h</strong><br>
                    <span class="encourage" id="encourage">千里之行，始于足下 🌱</span>
                </div>
            </div>
        </div>

        <!-- 固定励志语卡片，不可点击 -->
        <div class="slogan-card">
            <div class="slogan-left">
                <div class="slogan-icon">💪</div>
                <div class="slogan-text">人世间的一切幸福都需要靠辛勤的劳动来创造。</div>
            </div>
        </div>

        <div class="card" style="padding-bottom:16px;">
            <button class="btn-clock" onclick="clockIn()">打个卡</button>
        </div>

        <div class="card">
            <div class="card-title">下一岗</div>
            <div id="next"></div>
        </div>

        <div class="card">
            <div class="card-title">记录</div>
            <div id="history"></div>
            <div id="expandArea"></div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3>首班岗设置</h3>
            <p>设置你开始上班的第一岗，系统自动推算轮次</p>
            <label>日期</label>
            <input type="date" id="sDate" value="2026-04-19">
            <label>岗时间</label>
            <select id="sShift"></select>
            <div class="hint" id="shiftHint">第1轮第1岗 · D1 开始</div>
            <label>轮目标（小时）</label>
            <input type="number" id="sTarget" value="24" min="1" max="100">
            <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            <button class="btn btn-outline btn-sm" onclick="closeSettings()">取消</button>
        </div>
    </div>

    <div class="modal" id="settingsMenuModal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3>设置</h3>
            <p>管理首班岗与数据</p>
            <button class="btn btn-outline" onclick="openSettingsFromMenu()">设置首班岗</button>
            <button class="btn btn-outline" onclick="openScheduleEditor()">编辑排班</button>
            <button class="btn btn-outline btn-sm" onclick="resetAll()" style="color:var(--red);border-color:var(--red);">清空所有打卡数据</button>
            <button class="btn btn-outline btn-sm" onclick="closeSettingsMenu()" style="margin-top:8px;">取消</button>
        </div>
    </div>

    <div class="modal" id="actionModal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3 id="actionTitle">日期操作</h3>
            <p id="actionDate"></p>
            <div class="action-sheet" id="actionContent"></div>
            <button class="btn btn-outline btn-sm" onclick="closeActionModal()" style="margin-top:12px;">取消</button>
        </div>
    </div>

    <div class="modal result-modal" id="resultModal">
        <div class="modal-box">
            <div class="handle"></div>
            <div class="result-icon">✅</div>
            <div class="result-title">打卡成功！</div>
            <div class="result-detail" id="resultDetail"></div>
            <hr class="quote-divider">
            <div class="quote-text" id="quoteText"></div>
            <div class="quote-author" id="quoteAuthor"></div>
            <button class="btn btn-primary" onclick="closeResultModal()" style="margin-top:16px;">好的</button>
        </div>
    </div>

    <div class="modal" id="scheduleModal">
        <div class="modal-box">
            <div class="handle"></div>
            <h3>编辑排班</h3>
            <p>自定义 D1~D5 每天的时段和小时数</p>
            <div class="schedule-editor" id="scheduleEditor"></div>
            <button class="btn btn-primary" onclick="saveSchedule()">保存排班</button>
            <button class="btn btn-outline btn-sm" onclick="closeScheduleModal()">取消</button>
        </div>
    </div>

    <script>
        // 全局变量
        var DTYPES = ["D1", "D2", "D3", "D4", "D5"];
        // 动态排班数据（从 localStorage 读取或使用默认值）
        var DYNAMIC_DAILY = {};
        var DYNAMIC_SHIFTS = []; // 所有时段的合集，用于计算小时数
        
        // 默认排班数据
        var DEFAULT_DAILY = {
            D1: ["20:00-23:00"],
            D2: ["07:20-11:30", "23:00-24:00"],
            D3: ["00:00-02:00", "11:30-14:30", "17:30-20:00"],
            D4: ["02:00-05:00", "14:30-17:30"],
            D5: ["05:00-07:20"]
        };
        
        // 默认时段小时数映射
        var DEFAULT_SHIFT_HOURS = {
            "07:20-11:30": 4.2,
            "11:30-14:30": 3,
            "14:30-17:30": 3,
            "17:30-20:00": 2.5,
            "20:00-23:00": 3,
            "23:00-24:00": 1,
            "00:00-02:00": 2,
            "02:00-05:00": 3,
            "05:00-07:20": 2.3
        };
        
        // 初始化排班数据
        function initSchedule() {
            var saved = localStorage.getItem('custom_schedule');
            if (saved) {
                try {
                    var parsed = JSON.parse(saved);
                    DYNAMIC_DAILY = parsed.daily || JSON.parse(JSON.stringify(DEFAULT_DAILY));

        function openActionModal(ds) { var wd = wk(ds); document.getElementById('actionTitle').textContent = '操作：' + ds + '（' + wd + '）'; document.getElementById('actionDate').textContent = '类型：' + getDayTypeForDate(ds) + ' | 费率：' + getRateLabel(ds); var html = ''; if (isHoliday(ds) && !S.manualHolidays[ds]) { html += '<div class="as-btn holiday" onclick="removeHoliday(\'' + ds + '\')">取消节假日 · 当前系统识别为节假日</div>'; } else if (S.manualHolidays[ds]) { html += '<div class="as-btn" onclick="removeHoliday(\'' + ds + '\')">取消手动节假日标记</div>'; } else { html += '<div class="as-btn holiday" onclick="setHoliday(\'' + ds + '\')">标记为节假日（' + HOLIDAY_RATE + '元/h）</div>'; } if (isVacation(ds)) { html += '<div class="as-btn" onclick="removeVacation(\'' + ds + '\')">取消休假 · 恢复打卡</div>'; } else { html += '<div class="as-btn vacation" onclick="setVacation(\'' + ds + '\')">休假 · 屏蔽当天所有岗</div>'; } if (isWorkdayWeekend(ds) && !S.manualWorkdayWeekends[ds]) { html += '<div class="as-btn workday" onclick="removeWorkdayWeekend(\'' + ds + '\')">取消调休上班 · 恢复为周末计费</div>'; } else if (S.manualWorkdayWeekends[ds]) { html += '<div class="as-btn" onclick="removeWorkdayWeekend(\'' + ds + '\')">取消手动调休上班标记</div>'; } else if (we(ds) && !isHoliday(ds) && !isVacation(ds)) { html += '<div class="as-btn workday" onclick="setWorkdayWeekend(\'' + ds + '\')">标记为调休上班（' + WEEKDAY_RATE + '元/h）</div>'; } var allDayShifts = DYNAMIC_DAILY[getDayTypeForDate(ds)] || []; if (allDayShifts.length > 0 && !isVacation(ds)) { html += '<div class="as-section-title">当天时间段（点击屏蔽/恢复）</div>'; var blocked = S.blockedShifts[ds] || {}; for (var i = 0; i < allDayShifts.length; i++) { var ss = allDayShifts[i]; var isBlocked = !!blocked[ss]; html += '<div class="as-shift-row">'; html += '<span>' + ss + '（' + sh(ss).toFixed(1) + 'h）</span>'; if (isBlocked) { html += '<div class="as-toggle blocked" onclick="toggleShift(\'' + ds + '\',\'' + ss + '\',false)">已屏蔽</div>'; } else { html += '<div class="as-toggle active" onclick="toggleShift(\'' + ds + '\',\'' + ss + '\',true)">正常</div>'; } html += '</div>'; } } document.getElementById('actionContent').innerHTML = html; document.getElementById('actionModal').classList.add('on'); }
        function closeActionModal() { document.getElementById('actionModal').classList.remove('on'); }
        function setHoliday(ds) { S.manualHolidays[ds] = true; if (S.vacationDays[ds]) delete S.vacationDays[ds]; save(); validate(); update(); closeActionModal(); toast(ds + ' 已标记为节假日'); }
        function removeHoliday(ds) { if (S.manualHolidays[ds]) delete S.manualHolidays[ds]; save(); validate(); update(); closeActionModal(); toast(ds + ' 已取消节假日标记'); }
        function setVacation(ds) { S.vacationDays[ds] = true; if (S.manualHolidays[ds]) delete S.manualHolidays[ds]; save(); validate(); update(); closeActionModal(); toast(ds + ' 已设为休假，当天所有岗已屏蔽'); }
        function removeVacation(ds) { if (S.vacationDays[ds]) delete S.vacationDays[ds]; save(); validate(); update(); closeActionModal(); toast(ds + ' 已取消休假，恢复正常打卡'); }
        function setWorkdayWeekend(ds) { S.manualWorkdayWeekends[ds] = true; save(); validate(); update(); closeActionModal(); toast(ds + ' 已标记为调休上班'); }
        function removeWorkdayWeekend(ds) { if (S.manualWorkdayWeekends[ds]) delete S.manualWorkdayWeekends[ds]; save(); validate(); update(); closeActionModal(); toast(ds + ' 已恢复为周末计费'); }
        function toggleShift(ds, ss, block) { if (!S.blockedShifts[ds]) S.blockedShifts[ds] = {}; if (block) { S.blockedShifts[ds][ss] = true; } else { delete S.blockedShifts[ds][ss]; if (Object.keys(S.blockedShifts[ds]).length === 0) delete S.blockedShifts[ds]; } save(); validate(); update(); openActionModal(ds); }
        function toast(m) { var o = document.querySelector('.toast'); if (o) o.remove(); var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function() { if (t.parentNode) t.remove(); }, 2200); }
        
        function save() { try { var data = { target: S.target, firstDate: S.firstDate, firstShift: S.firstShift, recs: S.recs, news: S.news, setup: S.setup, manualHolidays: S.manualHolidays, blockedShifts: S.blockedShifts, vacationDays: S.vacationDays, manualWorkdayWeekends: S.manualWorkdayWeekends }; localStorage.setItem('clockin_v18', JSON.stringify(data)); } catch (e) {} }
        function load() { try { var raw = localStorage.getItem('clockin_v18'); if (raw) { var d = JSON.parse(raw); S.target = d.target || 24; S.firstDate = d.firstDate || ""; S.firstShift = d.firstShift || ""; S.recs = d.recs || []; S.news = d.news || []; S.setup = d.setup !== undefined ? d.setup : false; S.manualHolidays = d.manualHolidays || {}; S.blockedShifts = d.blockedShifts || {}; S.vacationDays = d.vacationDays || {}; S.manualWorkdayWeekends = d.manualWorkdayWeekends || {}; } else { S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; } } catch (e) { S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; } }
        function validate() { var a = S.recs.concat(S.news), f = false, i; for (i = 0; i < a.length; i++) { var r = a[i], cw = wk(r.d), crt = rt(r.d), ct = getDayTypeForDate(r.d); if (r.w !== cw) { r.w = cw; f = true; } if (r.r !== crt) { r.r = crt; r.a = r.h * crt; f = true; } if (r.t !== ct) { r.t = ct; f = true; } } if (f) save(); }
        
        function openSettings() { if (S.firstDate) { document.getElementById('sDate').value = S.firstDate; } if (S.firstShift) { document.getElementById('sShift').value = S.firstShift; } document.getElementById('sTarget').value = S.target; updateShiftHint(); document.getElementById('modal').classList.add('on'); }
        function closeSettings() { document.getElementById('modal').classList.remove('on'); }
        function updateShiftHint() { var ss = document.getElementById('sShift').value; var dt = shiftToDType(ss); document.getElementById('shiftHint').textContent = '第1轮第1岗 · ' + dt + ' 开始'; }
        
        function saveSettings() { var d = document.getElementById('sDate').value; var ss = document.getElementById('sShift').value; var t = parseInt(document.getElementById('sTarget').value); if (!d) { toast('请选择日期'); return; } if (!ss) { toast('请选择岗时间'); return; } if (isNaN(t) || t < 1) { toast('请输入有效目标'); return; } S.firstDate = d; S.firstShift = ss; S.target = t; S.setup = true; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; save(); validate(); update(); document.getElementById('history').innerHTML = ''; closeSettings(); toast('已保存，轮次已重新计算'); }
        
        function openSettingsMenu() { document.getElementById('settingsMenuModal').classList.add('on'); }
        function closeSettingsMenu() { document.getElementById('settingsMenuModal').classList.remove('on'); }
        function openSettingsFromMenu() { closeSettingsMenu(); openSettings(); }
        
        function resetAll() { if (confirm('确定要清空所有打卡数据吗？此操作不可恢复。')) { S.setup = false; S.recs = []; S.news = []; S.manualHolidays = {}; S.blockedShifts = {}; S.vacationDays = {}; S.manualWorkdayWeekends = {}; S.firstDate = ""; S.firstShift = ""; S.target = 24; QUOTES_USED = []; EXPANDED = false; save(); validate(); update(); document.getElementById('history').innerHTML = ''; closeSettingsMenu(); toast('已清空，请重新设置首班岗'); } }
        
        // 排班编辑器相关
        function openScheduleEditor() {
            renderScheduleEditor();
            document.getElementById('scheduleModal').classList.add('on');
            closeSettingsMenu();
        }
        
        function closeScheduleModal() {
            document.getElementById('scheduleModal').classList.remove('on');
        }
        
        function renderScheduleEditor() {
            var container = document.getElementById('scheduleEditor');
            var html = '';
            for (var i = 0; i < DTYPES.length; i++) {
                var dtype = DTYPES[i];
                var shifts = DYNAMIC_DAILY[dtype] || [];
                html += '<div class="dtype-section">';
                html += '<div class="dtype-header">' + dtype + '</div>';
                html += '<div id="shifts-' + dtype + '">';
                for (var j = 0; j < shifts.length; j++) {
                    var shiftLabel = shifts[j];
                    var hours = getShiftHours(shiftLabel);
                    var parts = shiftLabel.split('-');
                    var startTime = parts[0] || '';
                    var endTime = parts[1] || '';
                    html += '<div class="shift-item" data-dtype="' + dtype + '" data-index="' + j + '">';
                    html += '<input type="time" class="shift-start" value="' + startTime + '" style="flex:1;">';
                    html += '<span>~</span>';
                    html += '<input type="time" class="shift-end" value="' + endTime + '" style="flex:1;">';
                    html += '<input type="number" class="shift-hours" value="' + hours.toFixed(1) + '" step="0.1" style="width:70px;">';
                    html += '<button onclick="removeShiftItem(this)">删</button>';
                    html += '</div>';
                }
                html += '</div>';
                html += '<button class="add-shift-btn" onclick="addShiftItem(\'' + dtype + '\')">+ 增加时段</button>';
                html += '</div>';
            }
            container.innerHTML = html;
        }
        
        function addShiftItem(dtype) {
            if (!DYNAMIC_DAILY[dtype]) DYNAMIC_DAILY[dtype] = [];
            DYNAMIC_DAILY[dtype].push("00:00-01:00");
            // 同步更新 DYNAMIC_SHIFTS
            rebuildShiftsFromDaily();
            renderScheduleEditor();
        }
        
        function removeShiftItem(btn) {
            var shiftItem = btn.closest('.shift-item');
            var dtype = shiftItem.getAttribute('data-dtype');
            var index = parseInt(shiftItem.getAttribute('data-index'));
            if (DYNAMIC_DAILY[dtype] && DYNAMIC_DAILY[dtype][index]) {
                DYNAMIC_DAILY[dtype].splice(index, 1);
                rebuildShiftsFromDaily();
                renderScheduleEditor();
            }
        }
        
        function rebuildShiftsFromDaily() {
            // 重新构建 DYNAMIC_SHIFTS
            var newShifts = [];
            var hourMap = {};
            for (var dtype in DYNAMIC_DAILY) {
                var shiftsList = DYNAMIC_DAILY[dtype];
                for (var i = 0; i < shiftsList.length; i++) {
                    var ss = shiftsList[i];
                    if (!hourMap[ss]) {
                        var parts = ss.split('-');
                        if (parts.length === 2) {
                            var start = parts[0];
                            var end = parts[1];
                            var hours = calcHours(start, end);
                            hourMap[ss] = hours;
                            newShifts.push({ s: start, e: end, h: hours, label: ss });
                        }
                    }
                }
            }
            DYNAMIC_SHIFTS = newShifts;
            updateGlobalShiftsAndDaily();
        }
        
        function collectScheduleFromEditor() {
            var sections = document.querySelectorAll('.dtype-section');
            var newDaily = {};
            for (var i = 0; i < sections.length; i++) {
                var section = sections[i];
                var dtypeHeader = section.querySelector('.dtype-header');
                if (!dtypeHeader) continue;
                var dtype = dtypeHeader.innerText.trim();
                var shiftItems = section.querySelectorAll('.shift-item');
                var shiftsList = [];
                for (var j = 0; j < shiftItems.length; j++) {
                    var item = shiftItems[j];
                    var start = item.querySelector('.shift-start').value;
                    var end = item.querySelector('.shift-end').value;
                    var hoursInput = item.querySelector('.shift-hours');
                    if (start && end) {
                        var shiftLabel = start + '-' + end;
                        var customHours = parseFloat(hoursInput.value);
                        shiftsList.push(shiftLabel);
                        // 更新小时数映射
                        var existingShift = null;
                        for (var k = 0; k < DYNAMIC_SHIFTS.length; k++) {
                            if (DYNAMIC_SHIFTS[k].label === shiftLabel) {
                                existingShift = DYNAMIC_SHIFTS[k];
                                break;
                            }
                        }
                        if (existingShift) {
                            existingShift.h = customHours;
                        } else {
                            DYNAMIC_SHIFTS.push({ s: start, e: end, h: customHours, label: shiftLabel });
                        }
                    }
                }
                newDaily[dtype] = shiftsList;
            }
            return newDaily;
        }
        
        function saveSchedule() {
            var newDaily = collectScheduleFromEditor();
            // 去重处理：移除重复的 shiftLabel
            for (var dtype in newDaily) {
                var unique = [];
                for (var i = 0; i < newDaily[dtype].length; i++) {
                    if (unique.indexOf(newDaily[dtype][i]) === -1) unique.push(newDaily[dtype][i]);
                }
                newDaily[dtype] = unique;
            }
            DYNAMIC_DAILY = newDaily;
            // 清理无效的 shift
            var validLabels = [];
            for (var dtype2 in DYNAMIC_DAILY) {
                validLabels = validLabels.concat(DYNAMIC_DAILY[dtype2]);
            }
            DYNAMIC_SHIFTS = DYNAMIC_SHIFTS.filter(function(shift) {
                return validLabels.indexOf(shift.label) !== -1;
            });
            updateGlobalShiftsAndDaily();
            saveScheduleToLocal();
            // 重新验证现有打卡数据
            validate();
            update();
            closeScheduleModal();
            toast('排班已保存');
            // 更新首班岗下拉框
            rebuildFirstShiftSelect();
        }
        
        function rebuildFirstShiftSelect() {
            var select = document.getElementById('sShift');
            if (!select) return;
            var allShifts = [];
            for (var dtype in DYNAMIC_DAILY) {
                for (var i = 0; i < DYNAMIC_DAILY[dtype].length; i++) {
                    var ss = DYNAMIC_DAILY[dtype][i];
                    if (allShifts.indexOf(ss) === -1) allShifts.push(ss);
                }
            }
            select.innerHTML = '';
            for (var j = 0; j < allShifts.length; j++) {
                var option = document.createElement('option');
                option.value = allShifts[j];
                option.textContent = allShifts[j] + ' (' + getShiftHours(allShifts[j]).toFixed(1) + 'h)';
                select.appendChild(option);
            }
            if (S.firstShift && allShifts.indexOf(S.firstShift) !== -1) {
                select.value = S.firstShift;
            } else if (allShifts.length > 0) {
                select.value = allShifts[0];
            }
            updateShiftHint();
        }
        
        document.addEventListener('click', function(e) {
            if (e.target === document.getElementById('modal')) closeSettings();
            if (e.target === document.getElementById('actionModal')) closeActionModal();
            if (e.target === document.getElementById('settingsMenuModal')) closeSettingsMenu();
            if (e.target === document.getElementById('resultModal')) closeResultModal();
            if (e.target === document.getElementById('scheduleModal')) closeScheduleModal();
        });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSettings();
                closeActionModal();
                closeSettingsMenu();
                closeResultModal();
                closeScheduleModal();
            }
        });
        
        window.onload = function() {
            initSchedule();
            updateGlobalShiftsAndDaily();
            load();
            if (!S.setup) {
                document.getElementById('days').textContent = '-';
                document.getElementById('hrs').textContent = '-';
                document.getElementById('amt').textContent = '-';
                document.getElementById('rnd').textContent = '-';
                document.getElementById('next').innerHTML = '<div class="empty">请先设置首班岗</div>';
            } else {
                validate();
                update();
            }
            rebuildFirstShiftSelect();
            // 绑定 shiftHint 更新
            var shiftSelect = document.getElementById('sShift');
            if (shiftSelect) {
                shiftSelect.addEventListener('change', updateShiftHint);
            }
        };
    </script>
